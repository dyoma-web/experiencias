/* ============================================================
   BANCO DE EXPERIENCIAS — Sistema gráfico (PNUD-style)
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  /* blues */
  --blue-900: #0a2a4f;
  --blue-800: #0c3b6e;
  --blue-700: #0a5aa6;   /* dark buttons */
  --blue-600: #1268c0;   /* primary */
  --blue-500: #2f86d6;
  --blue-400: #5ba1e0;
  --blue-300: #8fbeea;
  --blue-200: #bcd6f2;
  --blue-100: #dde9f8;
  --blue-50:  #eef4fc;
  /* teal accent */
  --teal-600: #1f9c8f;
  --teal-500: #2bb0a3;
  /* map scale */
  --map-alta: #1668c2;
  --map-media: #74a6dd;
  --map-baja: #c3d8f1;
  --map-none: #e9eff6;
  /* ink / text */
  --ink: #14233d;
  --text: #2c3a4e;
  --muted: #647186;
  --faint: #93a0b2;
  --line: #e2e9f1;
  --line-strong: #d2dce8;
  --panel: #f5f8fc;
  --panel-2: #eef3f9;
  --white: #ffffff;
  --shadow-sm: 0 1px 2px rgba(20,35,61,.06), 0 1px 1px rgba(20,35,61,.04);
  --shadow-md: 0 6px 22px rgba(20,35,61,.10), 0 2px 6px rgba(20,35,61,.06);
  --shadow-lg: 0 24px 60px rgba(12,40,80,.20);
  --r-sm: 7px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 18px;
  --sans: 'Source Sans 3', system-ui, -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
svg { display: block; }
button { font-family: inherit; cursor: pointer; }
::selection { background: var(--blue-200); }

/* keyboard focus visibility (accessibility) */
a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--blue-600); outline-offset: 2px; border-radius: 4px;
}
.geo-c:focus { outline: none; } /* sin recuadro al clic de ratón */
.geo-c:focus-visible { outline: 2px solid var(--blue-700); outline-offset: 1px; } /* se conserva para teclado */
.geo-c.clk { cursor: pointer; }

/* scrollbars */
.scroll::-webkit-scrollbar { width: 10px; height: 10px; }
.scroll::-webkit-scrollbar-thumb { background: #cdd8e6; border-radius: 20px; border: 3px solid transparent; background-clip: content-box; }
.scroll::-webkit-scrollbar-thumb:hover { background: #b4c2d4; background-clip: content-box; }

/* ---- brand mark (text lockup, not the UN emblem) ---- */
.pnud-mark {
  display: inline-grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--blue-600);
  padding: 5px;
  border-radius: 3px;
  line-height: 1;
}
.pnud-mark span {
  font-weight: 900;
  color: #fff;
  font-size: 12px;
  letter-spacing: .5px;
  width: 15px;
  height: 13px;
  display: grid;
  place-items: center;
}
.pnud-mark.lg { padding: 7px; }
.pnud-mark.lg span { font-size: 17px; width: 21px; height: 18px; }

/* ---- official PNUD logo (vertical lockup) ---- */
.pnud-logo { display: block; height: 40px; width: auto; }
.pnud-logo.lg { height: 56px; }

/* ============================================================
   PLATFORM
   ============================================================ */
.app {
  min-height: 100vh;
  background: #fff;
}
.app-shell {
  max-width: 1320px;
  margin: 0 auto;
  padding: 26px 30px 60px;
}

/* top bar */
.topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
.topbar-left { display: flex; align-items: center; gap: 16px; }
.topbar h1 { font-size: 27px; font-weight: 700; color: var(--blue-600); margin: 0; letter-spacing: -.3px; }
.topbar .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.topbar-note { display: flex; align-items: flex-start; gap: 8px; color: var(--blue-600); font-size: 12.5px; max-width: 230px; line-height: 1.35; text-align: right; text-decoration: none; }
.topbar-note svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.topbar-note span { color: var(--muted); }
.topbar-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }

/* language switch */
.lang-switch { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; overflow: hidden; background: var(--white); }
.lang-switch button { border: 0; background: transparent; padding: 5px 13px; font-size: 12.5px; font-weight: 700; letter-spacing: .4px; color: var(--muted); line-height: 1; }
.lang-switch button:hover { color: var(--blue-600); }
.lang-switch button.on { background: var(--blue-600); color: #fff; }
.lang-switch button:focus-visible { outline: 2px solid var(--blue-500); outline-offset: -2px; }

/* search */
.search {
  position: relative;
  margin-bottom: 14px;
}
.search svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--faint); }
.search input {
  width: 100%;
  border: 1.5px solid var(--line-strong);
  background: #fff;
  border-radius: var(--r-md);
  padding: 15px 18px 15px 50px;
  font-size: 15.5px;
  color: var(--ink);
  font-family: inherit;
  box-shadow: var(--shadow-sm);
  transition: border-color .15s, box-shadow .15s;
}
.search input::placeholder { color: var(--faint); }
.search input:focus { outline: none; border-color: var(--blue-500); box-shadow: 0 0 0 4px var(--blue-50); }

/* filter row */
.filters { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
.filter {
  position: relative;
}
.filter-btn {
  display: flex; align-items: center; gap: 9px;
  background: #fff;
  border: 1.5px solid var(--line-strong);
  border-radius: var(--r-md);
  padding: 11px 14px;
  font-size: 14px;
  color: var(--text);
  font-weight: 500;
  white-space: nowrap;
  box-shadow: var(--shadow-sm);
  transition: border-color .15s, background .15s;
}
.filter-btn:hover { border-color: var(--blue-300); }
.filter-btn.active { border-color: var(--blue-500); color: var(--blue-700); background: var(--blue-50); }
.filter-btn .lead { width: 17px; height: 17px; color: var(--blue-600); }
.filter-btn .chev { width: 16px; height: 16px; color: var(--faint); margin-left: 2px; transition: transform .18s; }
.filter-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
.filter-btn .count-pill {
  background: var(--blue-600); color: #fff; font-size: 11px; font-weight: 700;
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; display: grid; place-items: center;
}
.clear-btn {
  display: flex; align-items: center; gap: 7px;
  background: none; border: none; color: var(--muted); font-size: 13.5px; font-weight: 500;
  padding: 8px 6px; margin-left: auto; border-radius: var(--r-sm);
}
.clear-btn:hover { color: var(--blue-700); }
.clear-btn svg { width: 16px; height: 16px; }

/* dropdown menu */
.menu {
  position: absolute; top: calc(100% + 8px); left: 0; z-index: 40;
  background: #fff; border: 1px solid var(--line); border-radius: var(--r-md);
  box-shadow: var(--shadow-md); padding: 7px; min-width: 232px; max-height: 320px; overflow: auto;
}
.menu-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: left; background: none; border: none;
  padding: 9px 11px; border-radius: var(--r-sm); font-size: 13.5px; color: var(--text);
}
.menu-item:hover { background: var(--panel); }
.menu-item .check { width: 16px; height: 16px; border: 1.6px solid var(--line-strong); border-radius: 4px; flex: none; display: grid; place-items: center; }
.menu-item.sel .check { background: var(--blue-600); border-color: var(--blue-600); }
.menu-item.sel .check svg { width: 11px; height: 11px; color: #fff; }
.menu-item .flag { font-size: 15px; }
.flag-img { width: 21px; height: 15px; border-radius: 2.5px; object-fit: cover; box-shadow: 0 0 0 1px rgba(20,35,61,.1); flex: none; vertical-align: middle; }
.flag-img.big { width: 27px; height: 19px; border-radius: 3px; }
.menu-item .mi-count { margin-left: auto; font-size: 12px; color: var(--faint); }

/* main layout */
.main { display: grid; grid-template-columns: 392px 1fr; gap: 22px; align-items: start; }

/* card panel base */
.panel-card {
  background: #fff; border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
}
.panel-head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.panel-head h2 { font-size: 15px; font-weight: 700; color: var(--ink); margin: 0; }

/* map */
.map-panel { position: sticky; top: 20px; }
.map-title { font-size: 15px; font-weight: 700; color: var(--blue-600); margin: 0 0 10px; }
.map-box { padding: 0; overflow: hidden; }
.map-caption { font-size: 12px; color: var(--muted); margin-top: 11px; text-align: center; }

.geomap { position: relative; aspect-ratio: 460 / 586; background: linear-gradient(180deg, #eef4fb, #e6eef8); border-radius: var(--r-lg); overflow: hidden; }
.geomap-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.geo-ctx { fill: #d7e0ea; stroke: #fff; stroke-width: .7; }
.geo-c { stroke: #fff; stroke-width: .8; transition: filter .12s; }
.geo-c.faint { fill: var(--map-none) !important; }
.geo-c.clk { cursor: pointer; }
.geo-c.clk:hover { filter: brightness(1.09) saturate(1.12); }
.geo-c.sel { stroke: var(--ink); stroke-width: 1.9; filter: drop-shadow(0 1px 4px rgba(12,40,80,.45)); }

.map-zoom { position: absolute; top: 12px; left: 12px; z-index: 5; display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line-strong); border-radius: var(--r-sm); overflow: hidden; box-shadow: var(--shadow-sm); }
.map-zoom button { width: 30px; height: 30px; display: grid; place-items: center; background: #fff; border: none; color: var(--text); border-bottom: 1px solid var(--line); }
.map-zoom button:last-child { border-bottom: none; }
.map-zoom button:hover { background: var(--panel); color: var(--blue-700); }

.geo-tip { position: absolute; transform: translate(-50%, calc(-100% - 12px)); background: var(--ink); color: #fff; padding: 6px 10px; border-radius: 7px; pointer-events: none; white-space: nowrap; z-index: 12; box-shadow: var(--shadow-md); display: flex; flex-direction: column; gap: 1px; }
.geo-tip b { font-weight: 700; font-size: 12.5px; }
.geo-tip span { opacity: .82; font-size: 11px; }

.geo-legend { position: absolute; bottom: 14px; left: 14px; background: rgba(255,255,255,.95); backdrop-filter: blur(3px); border: 1px solid var(--line); border-radius: var(--r-md); padding: 11px 13px; display: flex; flex-direction: column; gap: 7px; box-shadow: var(--shadow-sm); }
.legend-row { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--text); font-weight: 500; }
.legend-sw { width: 14px; height: 14px; border-radius: 3px; flex: none; }

/* results header */
.results-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 14px; }
.results-head .count { font-size: 16px; font-weight: 700; color: var(--blue-600); }
.results-head .count em { color: var(--blue-700); font-style: normal; }
.sort { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); }
.sort .filter-btn { padding: 8px 12px; }

/* active chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; background: var(--blue-50); border: 1px solid var(--blue-100);
  color: var(--blue-800); font-size: 12.5px; font-weight: 600; padding: 5px 7px 5px 11px; border-radius: 20px;
}
.chip button { background: none; border: none; color: var(--blue-600); display: grid; place-items: center; padding: 0; border-radius: 50%; width: 18px; height: 18px; }
.chip button:hover { background: var(--blue-100); }
.chip button svg { width: 12px; height: 12px; }

/* experience cards */
.exp-list { display: flex; flex-direction: column; gap: 12px; }
.exp-card {
  display: grid; grid-template-columns: 50px 1fr auto; gap: 16px; align-items: start;
  background: #fff; border: 1px solid var(--line); border-radius: var(--r-md); padding: 18px 20px;
  box-shadow: var(--shadow-sm); cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .12s;
  text-align: left; width: 100%;
}
.exp-card:hover { border-color: var(--blue-300); box-shadow: var(--shadow-md); transform: translateY(-1px); }
.exp-ic { width: 50px; height: 50px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.exp-body { min-width: 0; }
.exp-title { font-size: 16px; font-weight: 700; color: var(--ink); line-height: 1.25; margin: 0 0 6px; }
.exp-meta { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.exp-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--faint); }
.exp-meta .dim { color: var(--text); font-weight: 600; }
.exp-tags { display: flex; gap: 7px; margin-top: 11px; flex-wrap: wrap; }
.tag { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 6px; background: var(--panel-2); color: var(--muted); }
.tag.pnud { background: var(--blue-50); color: var(--blue-700); }
.exp-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.exp-country { display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 700; color: var(--blue-700); white-space: nowrap; }
.exp-country .flag { font-size: 17px; }
.exp-inst { font-size: 12.5px; color: var(--muted); max-width: 170px; line-height: 1.3; }
.exp-year { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }

/* results footer actions */
.results-actions { display: flex; gap: 12px; margin-top: 20px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  font-size: 14.5px; font-weight: 600; padding: 13px 22px; border-radius: var(--r-md); border: 1.5px solid transparent;
  transition: background .15s, border-color .15s, color .15s; text-decoration: none;
}
.btn svg { width: 18px; height: 18px; }
.btn-primary { background: var(--blue-700); color: #fff; }
.btn-primary:hover { background: var(--blue-800); }
.btn-outline { background: #fff; color: var(--blue-700); border-color: var(--line-strong); }
.btn-outline:hover { border-color: var(--blue-500); background: var(--blue-50); }

/* empty state */
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty svg { width: 40px; height: 40px; color: var(--blue-200); margin: 0 auto 14px; }
.empty h3 { color: var(--ink); font-size: 17px; margin: 0 0 6px; }

/* ============================================================
   FICHA (slide-over)
   ============================================================ */
.overlay { position: fixed; inset: 0; background: rgba(12,30,55,.42); z-index: 90; opacity: 0; transition: opacity .22s; backdrop-filter: blur(1px); }
.overlay.open { opacity: 1; }
.ficha {
  position: fixed; top: 0; right: 0; height: 100vh; width: 540px; max-width: 92vw; background: #fff; z-index: 100;
  box-shadow: var(--shadow-lg); transform: translateX(100%); transition: transform .26s cubic-bezier(.4,0,.2,1);
  display: flex; flex-direction: column;
}
.ficha.open { transform: translateX(0); }
.ficha-head { padding: 22px 26px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 16px; }
.ficha-head .exp-ic { width: 54px; height: 54px; }
.ficha-close { margin-left: auto; background: var(--panel); border: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
.ficha-close:hover { background: var(--panel-2); color: var(--ink); }
.ficha-close svg { width: 18px; height: 18px; }
.ficha-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--blue-600); }
.ficha-title { font-size: 22px; font-weight: 700; color: var(--ink); line-height: 1.2; margin: 5px 0 0; }
.ficha-body { padding: 24px 26px 40px; overflow: auto; flex: 1; }
.ficha-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; margin-bottom: 24px; }
.ficha-grid .cell { background: #fff; padding: 14px 16px; }
.ficha-grid .cell .l { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; margin-bottom: 5px; }
.ficha-grid .cell .v { font-size: 14.5px; color: var(--ink); font-weight: 600; display: flex; align-items: center; gap: 7px; }
.ficha h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 10px; font-weight: 700; }
.ficha p.desc { font-size: 15.5px; line-height: 1.6; color: var(--text); margin: 0 0 24px; }
.ficha-results { list-style: none; padding: 0; margin: 0 0 24px; display: flex; flex-direction: column; gap: 10px; }
.ficha-results li { display: flex; gap: 11px; font-size: 14.5px; color: var(--text); line-height: 1.45; }
.ficha-results .mk { width: 20px; height: 20px; border-radius: 50%; background: var(--blue-50); color: var(--blue-600); display: grid; place-items: center; flex: none; margin-top: 1px; }
.ficha-results .mk svg { width: 12px; height: 12px; }
.ficha-sources { display: flex; flex-direction: column; gap: 8px; }
.source-link { display: flex; align-items: center; gap: 11px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-md); color: var(--blue-700); text-decoration: none; font-size: 14px; font-weight: 600; transition: border-color .15s, background .15s; }
.source-link:hover { border-color: var(--blue-300); background: var(--blue-50); }
.source-link svg { width: 17px; height: 17px; flex: none; }
.source-link .ext { margin-left: auto; color: var(--faint); }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 980px) {
  .app-shell { padding: 18px 16px 50px; }
  .main { grid-template-columns: 1fr; }
  .map-panel { position: static; max-width: 440px; margin: 0 auto; width: 100%; }
  .topbar { flex-direction: column; gap: 12px; }
  .topbar-right { align-items: flex-start; flex-direction: row-reverse; justify-content: flex-end; flex-wrap: wrap; gap: 12px; align-self: stretch; }
  .topbar-note { text-align: left; max-width: none; }
  .topbar h1 { font-size: 23px; }
  .filters { gap: 8px; }
  .filter-btn { padding: 10px 12px; font-size: 13px; }
  .clear-btn { margin-left: 0; }
  .exp-card { grid-template-columns: 44px 1fr; }
  .exp-ic { width: 44px; height: 44px; }
  .exp-right { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: flex-start; gap: 10px; flex-wrap: wrap; padding-left: 60px; }
  .exp-inst { max-width: none; }
}
@media (max-width: 540px) {
  .results-actions { flex-direction: column; }
  .btn { width: 100%; }
}

ations, local governments, UNDP","nivelDetalle":"Local","anioTexto":"2025","paisDetalle":"Uruguay","institucion":"Local Actors","comentarios":"It focuses on territorial organizations"}},{"id":18,"dimensionId":"colaborativa","pais":"UY","nivel":"Nacional","anio":2023,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/PNUD_Movi_Gob"}],"es":{"titulo":"Innovación en el sector público: experiencias y tendencias. Movi_Gob","resumen":"Espacio de intercambio sobre experiencias, tendencias y tecnologías para innovación en el sector público uruguayo.","buenaPractica":"Facilita aprendizaje entre instituciones y exposición a experiencias comparadas de Brasil, Chile y Reino Unido.","actores":"PNUD, referentes de innovación pública, GNova Lab, Nesta, Laboratorio de Gobierno de Chile","nivelDetalle":"Nacional","anioTexto":"2023","paisDetalle":"Uruguay","institucion":"Oficina Nacional del Servicio Civil (ONSC), la Agencia Nacional de Investigación e Innovación (ANII)","comentarios":"red de innovación pública: caso pertinente para fortalecer redes, aprendizaje institucional y cultura de experimentación."},"en":{"titulo":"Innovation in the public sector: experiences and trends. Movi_Gob","resumen":"A forum for exchanging experiences, trends, and technologies for innovation in Uruguay’s public sector.","buenaPractica":"Facilitates learning among institutions and exposure to comparative experiences from Brazil, Chile, and the United Kingdom.","actores":"UNDP, public innovation leaders, GNova Lab, Nesta, Chilean Government Laboratory","nivelDetalle":"National","anioTexto":"2023","paisDetalle":"Uruguay","institucion":"National Civil Service Office (ONSC), National Agency for Research and Innovation (ANII)","comentarios":"Public innovation network: a relevant case for strengthening networks, institutional learning and a culture of experimentation."}},{"id":19,"dimensionId":"colaborativa","pais":"UY","nivel"  redes sociales del CNJ y de tribunales socios, alcanzando a decenas de miles de personas e instalando temas clave en la agenda pública. undp+2","buenaPractica":"Comunicación institucional que va más allá del reporte burocrático y se convierte en herramienta de educación pública y alfabetización jurídica, reduciendo asimetrías de información y fortaleciendo la confianza en el sistema de justicia mediante contenidos accesibles y culturalmente relevantes. undp+1","actores":"Consejo Nacional de Justicia; tribunales socios del Programa Justiça Plural; equipos de comunicación; Programa de las Naciones Unidas para el Desarrollo (PNUD).","nivelDetalle":"Nacional","anioTexto":"Desde 2025","paisDetalle":"Brasil","institucion":"Conselho Nacional de Justiça (CNJ)","comentarios":"La serie cuenta con varias ediciones temáticas y se integra a estrategias más amplias de transparencia, diversidad e inclusión en el Poder Judicial brasileño, en el marco de la cooperación CNJ–PNUD. undp+2"},"en":{"titulo":"“Olhares Plurais” Bulletin Series for Legal Literacy","resumen":"Collection of analytical bulletins from the Justiça Plural Program that democratizes expert information on human rights and access to justice, translating complex research and institutional experiences into brief, visually innovative content inspired by Brazilian culture, disseminated via the CNJ’s website and social media and those of partner courts, reaching tens of thousands of people and placing key issues on the public agenda.","buenaPractica":"Institutional communication that goes beyond bureaucratic reporting to become a tool for public education and legal literacy, reducing information asymmetries and strengthening trust in the justice system through accessible and culturally relevant content.","actores":"National Council of Justice; partner courts of the Justiça Plural Program; communication teams; United Nations Development Program (UNDP).","nivelDetalle":"National","anioTexto":"From 2025","paisDetalle":"Brazil","institucion":"National Council of Justice (CNJ)","comentarios":"The series has several thematic editions and is integrated into broader strategies for transparency, diversity and inclusion in the Brazilian Judiciary, within the framework of the CNJ–UNDP cooperation. undp+2"}},{"id":22,"dimensionId":"comunicacional","pais":"CO","nivel":"Nacional","anio":2025,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/colombia/noticias/conversatorio-desmontando-narrativas-pnud-registraduria-convoca-expertos-internacionales-analizar-riesgos-desinformacion-colombia"}],"es":{"titulo":"Conversatorio “Desmontando narrativas: el nuevo ecosistema informativo en contextos electorales”","resumen":"Espacio de diálogo con expertas/os internacionales y locales para analizar riesgos de desinformación y su impacto en la integridad democrática.","buenaPractica":"Comunicación pública entendida como diálogo y alfabetización informativa para fortalecer confianza y resiliencia frente a desinformación. Participación de actores como periodismo, academia y OSC.","actores":"Registraduría; PNUD; expertas/os; medios, academia y sociedad civil.","nivelDetalle":"Nacional","anioTexto":"2025","paisDetalle":"Colombia","institucion":"Registraduría Nacional del Estado Civil","comentarios":"Foco en integridad informativa y capacidades frente a “polución informativa”."},"en":{"titulo":"Discussion Forum “Debunking Narratives: The New Information Ecosystem in Electoral Contexts”","resumen":"A space for dialogue with international and local experts to analyze the risks of disinformation and its impact on democratic integrity.","buenaPractica":"Public communication understood as dialogue and media literacy to strengthen trust and resilience in the face of disinformation. Participation of stakeholders such as journalism, academia, and CSOs.","actores":"National Registry; UNDP; experts; media, academia, and civil society.","nivel onal AI Assessment (UNDP AILA + UNESCO RAM) – Trinidad and Tobago","resumen":"National AI Readiness Assessment combining UNESCO RAM and UNDP AILA methodologies to guide policy, capabilities, and governance.","buenaPractica":"Integration of complementary frameworks (governance/ethics and capabilities) to develop a roadmap for responsible AI in the public sector.","actores":"MPAAI; UNDP; UNESCO and national stakeholders (public/private sector/academia).","nivelDetalle":"National","anioTexto":"2025–2026","paisDetalle":"Trinidad and Tobago","institucion":"Ministry of Public Administration and Artificial Intelligence (MPAAI)","comentarios":"Relevant national AI case with an institutional and governance approach."}},{"id":48,"dimensionId":"digital","pais":"UY","nivel":"Nacional","anio":2025,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"plataformaparticipacionciudadana.gub.uy","en":"plataformaparticipacionciudadana.gub.uy"},"url":"https://plataformaparticipacionciudadana.gub.uy/?locale=es"}],"es":{"titulo":"Plataforma de Participación Ciudadana Digital","resumen":"Herramienta digital para consultas públicas, procesos participativos y visualización de resultados y conclusiones de participación ciudadana.","buenaPractica":"Ofrece un canal estable, accesible y trazable para participación y consulta pública digital.","actores":"AGESIC, organismos públicos usuarios de la plataforma. PNUD","nivelDetalle":"Nacional","anioTexto":"actual","paisDetalle":"Uruguay","institucion":"AGESIC","comentarios":"Buen caso de digitalización con foco en participación. Es de AGESIC pero apoyada por PNUD por el proyecto + varias políticas apoyadas por PNUD"},"en":{"titulo":"Digital Citizen Participation Platform","resumen":"Digital tool for public consultations, participatory processes, and the visualization of results and conclusions from citizen participation.","buenaPractica":"It offers a stable, accessible, and traceable channel for digital public participation and consultation.","actores":"AGESIC, public agencies using the platform. UNDP","nivelDetalle":"National","anioTexto":"current","paisDetalle":"Uruguay","institucion":"AGESIC","comentarios":"Good case of digitalization with a focus on participation. It belongs to AGESIC but is supported by UNDP through the project + several policies supported by UNDP"}},{"id":49,"dimensionId":"digital","pais":"UY","nivel":"Nacional","anio":2025,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/uruguay/publicaciones/la-evolucion-de-agesic-y-la-transformacion-digital-del-estado"}],"es":{"titulo":"Generación de conocimiento sobre institucionalización de AGESIC","resumen":"Informe que documenta la trayectoria de AGESIC desde 2005 y analiza los factores que permitieron consolidar un Estado digital, inclusivo y resiliente.","buenaPractica":"Sistematiza aprendizajes institucionales y factores de éxito de la transformación digital del Estado.","actores":"PNUD, AGESIC","nivelDetalle":"Nacional","anioTexto":"2025","paisDetalle":"Uruguay","institucion":"AGESIC","comentarios":"Muy útil como referencia conceptual y comparada para esta dimensión."},"en":{"titulo":"Knowledge generation on the institutionalization of AGESIC","resumen":"Report documenting AGESIC’s trajectory since 2005 and analyzing the factors that enabled the consolidation of a digital, inclusive, and resilient state.","buenaPractica":"Systematizes institutional lessons learned and success factors of the digital transformation of the State.","actores":"UNDP, AGESIC","nivelDetalle":"National","anioTexto":"2025","paisDetalle":"Uruguay","institucion":"AGESIC","comentarios":"Very useful as a conceptual and comparative reference for this dimension."}},{"id":50,"dimensionId":"digital","pais":"UY","nivel":"Nacional","anio":2025,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"linkedin.com","en":"linkedin.com"},"url":"https://www.linkedin.com/posts/origenlatam_exciting-news-were-thrilled-to-announce-activity-7388661384730882048-ZDaK"},{"label":{"es":"linkedin.com","en":"linkedin.com"},"url":"https://www.linkedin.com/posts/origenlatam_we-are-very-excited-to-be-part-of-the-post-acceleration-activity-7440417733470736384-CN5B"}],"es":{"titulo":"BIOFIN – aplicación de blockchain para biodiversidad","resumen":"Colaboración en el marco del SDG Blockchain Accelerator para co-desarrollar soluciones basadas en blockchain orientadas a cerrar brechas de financiamiento para biodiversidad y servicios ecosistémicos.","buenaPractica":"Aplica tecnología emergente a un problema público concreto, con potencial para trazabilidad y movilización de financiamiento.","actores":"PNUD Uruguay, BIOFIN, Origen Latam, UNDP AltFinLab y socios del acelerador","nivelDetalle":"Nacional","anioTexto":"2025","paisDetalle":"Uruguay","institucion":"BIOFIN","comentarios":"La información pública localizada proviene de publicaciones de Origen Latam en LinkedIn; no encuentro fuente institucional más detallada."},"en":{"titulo":"BIOFIN – blockchain application for biodiversity","resumen":"Collaboration within the framework of the SDG Blockchain Accelerator to co-develop blockchain-based solutions aimed at closing financing gaps for biodiversity and ecosystem services.","buenaPractica":"Applies emerging technology to a specific public problem, with potential for traceability and mobilization of funding.","actores":"UNDP Uruguay, BIOFIN, Origen Latam, UNDP AltFinLab, and accelerator partners","nivelDetalle":"National","anioTexto":"2025","paisDetalle":"Uruguay","institucion":"BIOFIN","comentarios":"The public information located comes from Origen Latam publications on LinkedIn; I cannot find a more detailed institutional source."}},{"id":51,"dimensionId":"intergeneracional","pais":"BR","nivel":"Local","anio":2025,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/latin-america/blog/participar-para-confiar-juventudes-e-instituciones-con-futuro"}],"es":{"titulo":"Talleres de juventudes y democracia en el Plan Plurianual Participativo — Osasco","resumen":"Iniciativa en la que PNUD Brasil apoyó talleres con jóvenes del municipio de Osasco para incorporar su perspectiva en la formulación del Plan Plurianual Participativo (PPA) municipal. Se combinaron herramientas de prospectiva, como imágenes de futuro y rueda de futuros, con mecanismos de co‑creación institucional, convirtiendo la participación juvenil en un insumo estructurado para la planificación pública de mediano plazo.","buenaPractica":"Transformar un instrumento formal de planificación (PPA) en un espacio de equidad intergeneracional mediante metodologías específicas que incorporan la voz de las juventudes y la traducen en compromisos de mediano plazo.","actores":"PNUD Brasil; municipio de Osasco; organizaciones juveniles locales; equipos de planificación municipal.","nivelDetalle":"Municipal","anioTexto":"2024–2025","paisDetalle":"Brasil","institucion":"Municipio de Osasco","comentarios":"Muestra cómo la planificación participativa puede ir más allá de la consulta puntual, integrando la mirada de las juventudes en las prioridades y programas de desarrollo territorial."},"en":{"titulo":"Youth and Democracy Workshops in the Participatory Multi-Year Plan — Osasco","resumen":"An initiative in which UNDP Brazil supported workshops with young people in the municipality of Osasco to incorporate their perspective into the formulation of the municipal Participatory Multi-Year Plan (PPA). Foresight tools, such as visions of the future and future circles, were combined with institutional co-creation mechanisms, transforming youth participation into a structured input for medium-term public planning.","buenaPractica":"Transforming a formal planning instrument (PPA) into a space for intergenerational equity through specific methodologies that incorporate the voices of young people and translate them into medium-term commitments.","actores":"UNDP Brazil; Municipality of Osasco; local youth organizations; municipal planning teams.","nivelDetalle":"Municipal","anioTexto":"2024–2025","paisDetalle":"Brazil","institucion":"Municipality of Osasco","comentarios":"It shows how participatory planning can go beyond one-off consultation, integrating the perspective of youth into territorial development priorities and programmes."}},{"id":52,"dimensionId":"intergeneracional","pais":"CO","nivel":"Nacional","anio":2023,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/colombia/blog/juventudes-transformadoras-construccion-paz-subvenciones"}],"es":{"titulo":"Juventudes Transformadoras — Agenda JPS (Juventud, Paz y Seguridad)","resumen":"Proyecto mediante el cual PNUD y UNFPA Colombia apoyan a organizaciones juveniles en territorios históricamente afectados por el conflicto armado a través de subvenciones para iniciativas de construcción de paz. Las y los jóvenes utilizan arte, cultura, música y ancestralidad como metodologías propias, fortalecen redes entre organizaciones juveniles y promueven el diálogo con instituciones locales, posicionando a las juventudes como agentes activos de transformación.","buenaPractica":"Reconoce que la equidad intergeneracional exige presencia diferenciada en territorios con mayores brechas y demuestra que la participación significativa implica transferir recursos y capacidad de decisión a las juventudes, no solo abrir espacios de diálogo.","actores":"PNUD Colombia; UNFPA Colombia; organizaciones juveniles en territorios afectados por el conflicto armado; comunidades locales.","nivelDetalle":"Nacional con despliegue territorial","anioTexto":"Desde 2023","paisDetalle":"Colombia","institucion":"PNUD Colombia · UNFPA Colombia","comentarios":"Ejemplo de cómo la cooperación internacional puede apoyar la construcción de paz liderada por juventudes, fortaleciendo capacidades locales y redes territoriales desde un enfoque de derechos y de reconocimiento de las metodologías culturales propias."},"en":{"titulo":"Transformative Youth — YPS Agenda (Youth, Peace, and Security)","resumen":"A project through which UNDP and UNFPA Colombia support youth organizations in territories historically affected by armed conflict through grants for peacebuilding initiatives. Young people use art, culture, music, and ancestral traditions as their own methodologies, strengthen networks among youth organizations, and promote dialogue with local institutions, positioning youth as active agents of transformation.","buenaPractica":"It recognizes that intergenerational equity requires a differentiated presence in territories with the widest gaps and demonstrates that meaningful participation involves transferring resources and decision-making capacity to young people, not just opening spaces for dialogue.","actores":"UNDP Colombia; UNFPA Colombia; youth organizations in territories affected by armed conflict; local communities.","nivelDetalle":"National with territorial reach","anioTexto":"Since 2023","paisDetalle":"Colombia","institucion":"UNDP Colombia · UNFPA Colombia","comentarios":"Example of how international cooperation can support youth-led peacebuilding, strengthening local capacities and territorial networks from a rights-based approach and recognition of their own cultural methodologies."}},{"id":53,"dimensionId":"intergeneracional","pais":"HN","nivel":"Local","anio":2025,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/honduras/noticias/san-pedro-sula-hace-historia-con-el-primer-plan-local-de-juventudes-paz-y-seguridad-en-america-latina"}],"es":{"titulo":"Plan Local Integral de Juventudes, Paz y Seguridad (PLIJPS) — San Pedro Sula","resumen":"PNUD Honduras acompañó a la Municipalidad de San Pedro Sula en el diseño del primer plan local de juventudes, paz y seguridad de América Latina. A través de herramientas de gobernanza anticipatoria y participación de organizaciones juveniles, se identificaron riesgos, se construyeron escenarios de futuro y se tradujeron en acciones concretas de política local de paz y seguridad, incluyendo un mecanismo de seguimiento específico.","buenaPractica":"El PLIJPS incorpora la voz de las juventudes como punto de partida para definir prioridades de paz y seguridad, combina prospectiva y diagnóstico participativo y crea un Consejo Juvenil de Paz y Seguridad que convierte a las juventudes en coautoras de una hoja de ruta de largo plazo.","actores":"PNUD Honduras; Municipalidad de San Pedro Sula; Oficina de Asuntos de Desarme de las Naciones Unidas (UNODA); plataformas y organizaciones juveniles locales; instituciones de seguridad y justicia.","nivelDetalle":"Local","anioTexto":"2024–2025","paisDetalle":"Honduras","institucion":"Municipalidad de San Pedro Sula","comentarios":"Referente regional en juventudes, paz y seguridad; muestra cómo un municipio puede adoptar un enfoque de equidad intergeneracional situando las prioridades juveniles en el centro de la política local de seguridad y creando arreglos institucionales permanentes de participación."},"en":{"titulo":"Comprehensive Local Plan for Youth, Peace, and Security (PLIJPS) — San Pedro Sula","resumen":"UNDP Honduras supported the Municipality of San Pedro Sula in designing Latin America’s first local plan for youth, peace, and security. Through anticipatory governance tools and the participation of youth organizations, risks were identified, future scenarios were developed, and these were translated into concrete local peace and security policy actions, including a specific monitoring mechanism.","buenaPractica":"The PLIJPS incorporates the voices of young people as a starting point for defining peace and security priorities, combines foresight with participatory analysis, and establishes a Youth Council for Peace and Security that empowers young people to co-author a long-term roadmap.","actores":"UNDP Honduras; Municipality of San Pedro Sula; United Nations Office for Disarmament Affairs (UNODA); local youth platforms and organizations; security and justice institutions.","nivelDetalle":"Local","anioTexto":"2024–2025","paisDetalle":"Honduras","institucion":"Municipality of San Pedro Sula","comentarios":"Regional reference on youth, peace and security; it shows how a municipality can adopt an intergenerational equity approach by placing youth priorities at the center of local security policy and creating permanent institutional arrangements for participation."}},{"id":54,"dimensionId":"intergeneracional","pais":"UY","nivel":"Nacional","anio":2025,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/dialogo_intergeneracional_juventudes_politicas"}],"es":{"titulo":"Juventudes interpartidarias","resumen":"Iniciativa impulsada por PNUD Uruguay para crear espacios de diálogo interpartidario e intergeneracional entre juventudes políticas, con el fin de abordar desafíos de la democracia, desalentar la polarización y construir acuerdos temáticos de mediano y largo plazo. Las juventudes de varios partidos se reúnen con referentes de generaciones anteriores y candidaturas presidenciales para co‑diseñar agendas sobre el futuro democrático del país.","buenaPractica":"Articulación de participación juvenil estructurada, diálogo intergeneracional y construcción de consensos interpartidarios en un espacio sostenido más allá de los ciclos electorales, donde las juventudes co‑diseñan agendas y orientan decisiones presentes pensando en las generaciones futuras.","actores":"PNUD Uruguay; juventudes del Frente Amplio, Partido Nacional, Partido Colorado y Partido Independiente; generaciones políticas anteriores invitadas; candidaturas presidenciales.","nivelDetalle":"Nacional","anioTexto":"2023–2025","paisDetalle":"Uruguay","institucion":"Partidos políticos con representación parlamentaria · PNUD Uruguay","comentarios":"Ejemplo de cómo los partidos pueden institucionalizar la voz de las juventudes en la definición de agendas de largo plazo, reduciendo polarización y fortaleciendo la legitimidad democrática."},"en":{"titulo":"Cross-party youth groups","resumen":"An initiative launched by UNDP Uruguay to create spaces for inter-party and intergenerational dialogue among young political activists, with the aim of addressing challenges to democracy, discouraging polarization, and building medium- and long-term thematic agreements. Young people from various parties meet with leaders from previous generations and presidential candidates to co-design agendas for the country’s democratic future.","buenaPractica":"Coordination of structured youth participation, intergenerational dialogue, and the building of cross-party consensus in a sustained space that extends beyond electoral cycles, where young people co-design agendas and guide current decisions with future generations in mind.","actores":"UNDP Uruguay; youth wings of the Frente Amplio, the National Party, the Colorado Party, and the Independent Party; invited representatives from previous political generations; presidential candidates.","nivelDetalle":"National","anioTexto":"2023–2025","paisDetalle":"Uruguay","institucion":"Political parties with parliamentary representation · UNDP Uruguay","comentarios":"Example of how political parties can institutionalize the voice of youth in defining long-term agendas, reducing polarization and strengthening democratic legitimacy."}},{"id":55,"dimensionId":"anticipatoria","pais":"CR","nivel":"Nacional","anio":2022,"vinculadaPNUD":false,"destacada":false,"fuentes":[{"label":{"es":"mideplan.go.cr","en":"mideplan.go.cr"},"url":"https://www.mideplan.go.cr/planeamiento-con-vision-futuro-es-fundamental-para-avanzar-hacia-el-desarrollo-sostenible"}],"es":{"titulo":"Unidad de Análisis Prospectivo y Política Pública / Nodo de Prospectiva (Costa Rica)","resumen":"Fortalecimiento de capacidades y articulación de redes de prospectiva para planificación con visión de largo plazo desde MIDEPLAN.","buenaPractica":"Crea capacidades institucionales y vínculos con redes especializadas para sostener ejercicios prospectivos.","actores":"MIDEPLAN y redes de prospectiva (según referencia pública).","nivelDetalle":"Nacional","anioTexto":"2022 (referencia pública) – vigente","paisDetalle":"Costa Rica","institucion":"Ministerio de Planificación Nacional y Política Económica (MIDEPLAN)","comentarios":"Puede vincularse con procesos sectoriales y territoriales (agua/saneamiento, macro, etc.)."},"en":{"titulo":"Prospective Analysis and Public Policy Unit / Foresight Hub (Costa Rica)","resumen":"Capacity building and coordination of foresight networks for long-term planning through MIDEPLAN.","buenaPractica":"Builds institutional capacity and establishes links with specialized networks to support foresight exercises.","actores":"MIDEPLAN and foresight networks (according to public reference).","nivelDetalle":"National","anioTexto":"2022 (public reference) – ongoing","paisDetalle":"Costa Rica","institucion":"Ministry of National Planning and Economic Policy (MIDEPLAN)","comentarios":"It can be linked to sectoral and territorial processes (water/sanitation, macro, etc.)."}},{"id":56,"dimensionId":"anticipatoria","pais":"PE","nivel":"Nacional","anio":2021,"vinculadaPNUD":false,"destacada":false,"fuentes":[{"label":{"es":"OPSI / OCDE","en":"OPSI / OECD"},"url":"https://oecd-opsi.org/innovations/national-foresight-observatory/"}],"es":{"titulo":"National Foresight Observatory","resumen":"Plataforma digital con tendencias, riesgos, oportunidades, escenarios para fortalecer la planificación estratégica.","buenaPractica":"Institucionaliza la prospectiva como insumo permanente para políticas públicas y planificación de largo plazo.","actores":"CEPLAN; entidades públicas usuarias; academia y sector privado.","nivelDetalle":"Nacional","anioTexto":"2021–actualidad","paisDetalle":"Perú","institucion":"Centro Nacional de Planeamiento Estratégico (CEPLAN)","comentarios":"Encaje muy claro en D1; alta replicabilidad."},"en":{"titulo":"National Foresight Observatory","resumen":"Digital platform featuring trends, risks, opportunities, and scenarios to strengthen strategic planning.","buenaPractica":"Institutionalizes foresight as a permanent input for public policy and long-term planning.","actores":"CEPLAN; public sector users; academia and the private sector.","nivelDetalle":"National","anioTexto":"2021–present","paisDetalle":"Peru","institucion":"National Center for Strategic Planning (CEPLAN)","comentarios":"Very clear fit in D1; high replicability."}},{"id":57,"dimensionId":"anticipatoria","pais":"PE","nivel":"Nacional","anio":2025,"vinculadaPNUD":false,"destacada":false,"fuentes":[{"label":{"es":"observatorio.ceplan.gob.pe","en":"observatorio.ceplan.gob.pe"},"url":"https://observatorio.ceplan.gob.pe/"}],"es":{"titulo":"Observatorio Nacional de Prospectiva","resumen":"Plataforma pública de información sobre tendencias, escenarios, riesgos y oportunidades para apoyar la anticipación y la planificación.","buenaPractica":"Institucionaliza la prospectiva y facilita acceso abierto a insumos de futuro (tendencias, escenarios, publicaciones).","actores":"CEPLAN (Perú).","nivelDetalle":"Nacional","anioTexto":"(plataforma vigente)","paisDetalle":"Perú","institucion":"Centro Nacional de Planeamiento Estratégico (CEPLAN)","comentarios":"Útil como repositorio para ejercicios de foresight en entidades sectoriales y subnacionales."},"en":{"titulo":"National Foresight Observatory","resumen":"Public information platform on trends, scenarios, risks, and opportunities to support foresight and planning.","buenaPractica":"Institutionalizes foresight and facilitates open access to future-oriented inputs (trends, scenarios, publications).","actores":"CEPLAN (Peru).","nivelDetalle":"National","anioTexto":"(current platform)","paisDetalle":"Peru","institucion":"National Center for Strategic Planning (CEPLAN)","comentarios":"Useful as a repository for foresight exercises in sectoral and subnational entities."}},{"id":58,"dimensionId":"anticipatoria","pais":"UY","nivel":"Nacional","anio":2050,"vinculadaPNUD":false,"destacada":false,"fuentes":[{"label":{"es":"opp.gub.uy","en":"opp.gub.uy"},"url":"https://www.opp.gub.uy/es/node/1507"}],"es":{"titulo":"Estrategia Nacional de Desarrollo Uruguay 2050 (serie de divulgación)","resumen":"Proceso y publicaciones de prospectiva de largo plazo (Uruguay 2050) con estudios sectoriales y escenarios para orientar planificación pública.","buenaPractica":"Planeación de largo plazo basada en evidencia y ejercicios prospectivos comunicados públicamente.","actores":"OPP (Dirección de Planificación) y actores sectoriales según estudio.","nivelDetalle":"Nacional","anioTexto":"2016–2019 (serie Uruguay 2050)","paisDetalle":"Uruguay","institucion":"Oficina de Planeamiento y Presupuesto (OPP)","comentarios":"Puede inspirar metodologías de escenarios y estudios sectoriales replicables."},"en":{"titulo":"Uruguay 2050 National Development Strategy (outreach series)","resumen":"Long-term foresight process and publications (Uruguay 2050) with sectoral studies and scenarios to guide public planning.","buenaPractica":"Evidence-based long-term planning and publicly communicated foresight exercises.","actores":"OPP (Planning Directorate) and sectoral stakeholders as per the study.","nivelDetalle":"National","anioTexto":"2016–2019 (Uruguay 2050 series)","paisDetalle":"Uruguay","institucion":"Office of Planning and Budget (OPP)","comentarios":"It can inspire replicable scenario methodologies and sectoral studies."}},{"id":59,"dimensionId":"colaborativa","pais":"CL","nivel":"Nacional","anio":2015,"vinculadaPNUD":false,"destacada":false,"fuentes":[{"label":{"es":"lab.gob.cl","en":"lab.gob.cl"},"url":"https://www.lab.gob.cl/"}],"es":{"titulo":"Laboratorio de Gobierno (co-creación de soluciones y capacidades)","resumen":"Agencia estatal que co-crea soluciones a problemas públicos, instala capacidades de innovación en funcionariado y mide capacidades institucionales.","buenaPractica":"Modelo institucional de innovación pública con co-creación y enfoque en mejora de servicios para las personas.","actores":"Laboratorio de Gobierno; servicios públicos participantes; ciudadanía en procesos de co-creación.","nivelDetalle":"Nacional","anioTexto":"2015–actualidad","paisDetalle":"Chile","institucion":"Laboratorio de Gobierno (Ministerio de Hacienda)","comentarios":"Referente regional para metodologías de diseño de servicios y laboratorios públicos."},"en":{"titulo":"Government Lab (co-creation of solutions and capabilities)","resumen":"A government agency that co-creates solutions to public problems, builds innovation capabilities among civil servants, and measures institutional capabilities.","buenaPractica":"Institutional model of public innovation with co-creation and a focus on improving services for people.","actores":"Government Lab; participating public services; citizens in co-creation processes.","nivelDetalle":"National","anioTexto":"2015–present","paisDetalle":"Chile","institucion":"Government Lab (Ministry of Finance)","comentarios":"Regional reference for service design methodologies and public laboratories."}},{"id":60,"dimensionId":"colaborativa","pais":"CL","nivel":"Local","anio":2024,"vinculadaPNUD":false,"destacada":false,"fuentes":[{"label":{"es":"datos.municipalidadmaipu.cl","en":"datos.municipalidadmaipu.cl"},"url":"https://datos.municipalidadmaipu.cl/multimedia"}],"es":{"titulo":"Red de Líderes de Datos y Transformación Digital (gestión del cambio interno)","resumen":"Red interna de funcionariado municipal para impulsar cooperación, innovación y modernización.","buenaPractica":"Gobernanza interna colaborativa para sostener la transformación digital y la innovación en servicios locales.","actores":"Municipalidad de Maipú (Centro de Gobierno; Canales y TI).","nivelDetalle":"Local","anioTexto":"2024 (referencia pública en sitio institucional)","paisDetalle":"Chile","institucion":"Municipalidad de Maipú","comentarios":"Vinculada a la estrategia municipal de datos y modernización."},"en":{"titulo":"Network of Data and Digital Transformation Leaders (internal change management)","resumen":"Internal network of municipal officials to promote cooperation, innovation, and modernization.","buenaPractica":"Collaborative internal governance to support digital transformation and innovation in local services.","actores":"Municipality of Maipú (Government Center; Channels and IT).","nivelDetalle":"Local","anioTexto":"2024 (public reference on institutional website)","paisDetalle":"Chile","institucion":"Municipality of Maipú","comentarios":"Linked to the municipal data and modernization strategy."}},{"id":61,"dimensionId":"colaborativa","pais":"CO","nivel":"Local","anio":2022,"vinculadaPNUD":false,"destacada":false,"fuentes":[{"label":{"es":"OPSI / OCDE","en":"OPSI / OECD"},"url":"https://oecd-opsi.org/innovations/bogotas-innovation-strategy/"}],"es":{"titulo":"The Spider: La estrategia de innovación pública de Bogotá","resumen":"Estrategia para crear un ecosistema de innovación pública sostenible en el tiempo, más allá de los laboratorios.","buenaPractica":"Gobernanza en red, co-creación y diseño estratégico para instalar capacidades de innovación en múltiples entidades.","actores":"Alcaldía de Bogotá; 10 entidades del ecosistema distrital; sin PNUD en la ficha.","nivelDetalle":"Local","anioTexto":"2022–actualidad","paisDetalle":"Colombia","institucion":"Alcaldía Mayor de Bogotá / ecosistema distrital de innovación","comentarios":"Interesante para mapear innovación pública a escala ciudad."},"en":{"titulo":"The Spider: Bogotá’s public innovation strategy","resumen":"Strategy to create a sustainable public innovation ecosystem over time, beyond the labs.","buenaPractica":"Network governance, co-creation, and strategic design to build innovation capabilities across multiple entities.","actores":"Bogotá City Hall; 10 entities from the district innovation ecosystem; UNDP not listed in the profile.","nivelDetalle":"Local","anioTexto":"2022–present","paisDetalle":"Colombia","institucion":"Mayor’s Office of Bogotá / District Innovation Ecosystem","comentarios":"Interesting for mapping public innovation at the city scale."}},{"id":62,"dimensionId":"colaborativa","pais":"CO","nivel":"Subnacional","anio":2024,"vinculadaPNUD":false,"destacada":false,"fuentes":[{"label":{"es":"oas.org","en":"oas.org"},"url":"https://www.oas.org/ext/es/principal/calendario/evento/moduleid/14104/id/541/lang/2/controller/item/action/eventdownload"}],"es":{"titulo":"Sistema de Gestión Social Integral (SIGESI) e‑Gov","resumen":"Sistema para articular oferta y seguimiento de gestión social, integrando herramientas digitales para mejorar coordinación y atención.","buenaPractica":"Integra gestión social con soluciones digitales para mejorar coordinación, trazabilidad y respuesta institucional.","actores":"Gobernación del Valle del Cauca; OEA/DGPE (Premio PIGEP) y actores territoriales.","nivelDetalle":"Subnacional / departamental","anioTexto":"2024 (PIGEP)","paisDetalle":"Colombia","institucion":"Gobernación del Valle del Cauca","comentarios":"Experiencia destacada en el marco del Premio Interamericano a la Innovación para la Gestión Pública Efectiva (PIGEP)."},"en":{"titulo":"Comprehensive Social Management System (SIGESI) e-Gov","resumen":"System for coordinating social services and monitoring social management, integrating digital tools to improve coordination and service delivery.","buenaPractica":"Integrates social management with digital solutions to improve coordination, traceability, and institutional response.","actores":"Valle del Cauca Governor’s Office; OAS/DGPE (PIGEP Award) and local stakeholders.","nivelDetalle":"Subnational / departmental","anioTexto":"2024 (PIGEP)","paisDetalle":"Colombia","institucion":"Valle del Cauca Governor’s Office","comentarios":"Experience recognized within the framework of the Inter-American Award for Innovation in Effective Public Management (PIGEP)."}},{"id":63,"dimensionId":"colaborativa","pais":"CO","nivel":"Nacional","anio":2024,"vinculadaPNUD":false,"destacada":false,"fuentes":[{"label":{"es":"funcionpublica.gov.co","en":"funcionpublica.gov.co"},"url":"https://www.funcionpublica.gov.co/colaboracion-e-innovacion"}],"es":{"titulo":"Colaboración e innovación (orientaciones y apoyo a laboratorios)","resumen":"Lineamientos y herramientas para interacción con ciudadanía y desarrollo de laboratorios/espacios de innovación en entidades públicas.","buenaPractica":"Estandariza metodologías y promueve redes de co-creación para resolver desafíos públicos.","actores":"DAFP; entidades públicas implementadoras; ciudadanía y grupos de valor.","nivelDetalle":"Nacional","anioTexto":"2024–actualidad (guía v3, 2024)","paisDetalle":"Colombia","institucion":"Departamento Administrativo de la Función Pública (DAFP)","comentarios":"Útil como marco para que instituciones creen/fortalezcan sus laboratorios con enfoque de vida (bioadministración)."},"en":{"titulo":"Collaboration and innovation (guidance and support for innovation labs)","resumen":"Guidelines and tools for engaging with citizens and developing innovation labs/spaces in public entities.","buenaPractica":"Standardizes methodologies and promotes co-creation networks to address public challenges.","actores":"DAFP; implementing public entities; citizens and stakeholder groups.","nivelDetalle":"National","anioTexto":"2024–present (guide v3, 2024)","paisDetalle":"Colombia","institucion":"Administrative Department of Public Service (DAFP)","comentarios":"Useful as a framework for institutions to create/strengthen their laboratories with a life-centered approach (bioadministration)."}},{"id":64,"dimensionId":"colaborativa","pais":"CO","nivel":"Local","anio":2027,"vinculadaPNUD":false,"destacada":false,"fuentes":[{"label":{"es":"colaboralab.bucaramanga.gov.co","en":"colaboralab.bucaramanga.gov.co"},"url":"https://colaboralab.bucaramanga.gov.co/quienes-somos/"}],"es":{"titulo":"CoLabora – Laboratorio de Innovación Pública CoLabora (Secretaría Jurídica / Proyecto de Transparencia y Lucha contra la Corrupción)","resumen":"Laboratorio de innovación pública que impulsa espacios de cocreación (talleres, retos y prototipos) para mejorar servicios y soluciones urbanas, promoviendo colaboración entre gobierno local, ciudadanía y actores del ecosistema.","buenaPractica":"Institucionalización de un laboratorio municipal como mecanismo permanente de innovación pública y cocreación con ciudadanía, alineado a políticas de transparencia/anticorrupción y al plan de desarrollo municipal.","actores":"Alcaldía de Bucaramanga (Secretaría Jurídica y áreas sectoriales); ciudadanía; organizaciones locales; academia/sector privado (según retos).","nivelDetalle":"local","anioTexto":"2024–2027 (en curso)","paisDetalle":"Colombia","institucion":"Alcaldía de Bucaramanga","comentarios":"Caso con alto potencial de replicabilidad para municipios: metodología de retos, cocreación y prototipado; útil también como cruce con Dimensión 4 (transparencia)."},"en":{"titulo":"CoLabora – CoLabora Public Innovation Lab (Legal Secretariat / Transparency and Anti-Corruption Project)","resumen":"Public innovation lab that fosters co-creation spaces (workshops, challenges, and prototypes) to improve urban services and solutions, promoting collaboration between local government, citizens, and ecosystem stakeholders.","buenaPractica":"Institutionalization of a municipal lab as a permanent mechanism for public innovation and co-creation with citizens, aligned with transparency/anti-corruption policies and the municipal development plan.","actores":"Bucaramanga Mayor’s Office (Legal Secretariat and sectoral departments); citizens; local organizations; academia/private s cción de canales estables de ida y vuelta entre gobierno y comunidades, con presencia territorial y digital continuada, que permite co‑diseñar acciones en seguridad, fortalecer la confianza y la legitimidad institucional en contextos de alta conflictividad. tucuman+1","actores":"Secretaría de Participación Ciudadana; Ministerio de Seguridad de Tucumán; escuelas y universidades; organizaciones comunitarias; municipios y comunas rurales; liderazgos barriales y juveniles. tucuman+1","nivelDetalle":"Provincial","anioTexto":"Desde 2016","paisDetalle":"Argentina","institucion":"Secretaría de Estado de Participación Ciudadana de Tucumán","comentarios":"Referente regional en seguridad democrática y ciudadanía digital; el modelo articula programas diversos bajo una misma estrategia, facilitando sostenibilidad política y técnica. tucuman+2"},"en":{"titulo":"Community Participation and Public Safety Model","resumen":"A model that integrates programs such as Smart Security, School of Citizenship, Organizing Communities, and Weaving Networks, combining civic education, community prevention, digital citizenship, innovation, and grassroots work to address security from a rights-based and shared responsibility approach, through workshops, labs, campaigns, and sustained spaces for dialogue between government and communities.","buenaPractica":"Building stable two-way channels between government and communities, with a continuous on-the-ground and digital presence, enabling the co-design of security actions and strengthening trust and institutional legitimacy in highly conflicted contexts.","actores":"Secretariat of Citizen Participation; Tucumán Ministry of Security; schools and universities; community organizations; municipalities and rural communities; neighborhood and youth leaders.","nivelDetalle":"Provincial","anioTexto":"Since 2016","paisDetalle":"Argentina","institucion":"Secretariat of State for Citizen Participation of Tucumán","comentarios":"Regional reference in democratic security and digital citizenship; the model articulates diverse programmes under a single strategy, facilitating political and technical sustainability. tucuman+2"}},{"id":70,"dimensionId":"comunicacional","pais":"AR","nivel":"Local","anio":2019,"vinculadaPNUD":false,"destacada":false,"fuentes":[{"label":{"es":"OPSI / OCDE","en":"OPSI / OECD"},"url":"https://oecd-opsi.org/innovations/boti-the-citys-whatsapp/"}],"es":{"titulo":"Boti, the City's WhatsApp","resumen":"Canal conversacional de atención ciudadana por WhatsApp para resolver consultas, orientar trámites e informar en tiempo real.","buenaPractica":"Comunicación pública multicanal, simple y cercana, integrada con servicios y datos públicos.","actores":"Gobierno de la Ciudad de Buenos Aires.","nivelDetalle":"Local","anioTexto":"2019–actualidad","paisDetalle":"Argentina (CABA)","institucion":"Gobierno de la Ciudad de Buenos Aires","comentarios":"Cruza con D5."},"en":{"titulo":"Boti, the City's WhatsApp","resumen":"Conversational citizen service channel via WhatsApp to resolve inquiries, guide procedures, and provide real-time information.","buenaPractica":"Simple, accessible, multi-channel public communication integrated with public services and data.","actores":"Government of the City of Buenos Aires.","nivelDetalle":"Local","anioTexto":"2019–present","paisDetalle":"Argentina (CABA)","institucion":"Government of the City of Buenos Aires","comentarios":"It crosses with D5."}},{"id":71,"dimensionId":"comunicacional","pais":"BO","nivel":"Nacional","anio":2026,"vinculadaPNUD":false,"destacada":false,"fuentes":[{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/bolivia/coalicion-nacional-contra-la-desinformacion-electoral-cncde"}],"es":{"titulo":"Coalición Nacional contra la Desinformación Electoral (CNCDE)","resumen":"Esfuerzo interinstitucional para combatir desinformación y discursos de odio en procesos electorales, con participación de entidades públicas y aliados.","buenaPracti actor y foco en integridad democrática e información confiable.","actores":"TSE; plataformas digitales; instituciones asociadas; sociedad civil (según acuerdos).","nivelDetalle":"Nacional","anioTexto":"2018–actualidad","paisDetalle":"Brasil","institucion":"Tribunal Superior Eleitoral (TSE)","comentarios":"Experiencia replicable por autoridades electorales en estrategias de prevención y respuesta frente a fake news."},"en":{"titulo":"Permanent Program to Combat Disinformation","resumen":"Program by the electoral body to combat disinformation, including partnerships with platforms, institutions, and actions during electoral processes.","buenaPractica":"Permanent strategy with multi-stakeholder partnerships and a focus on democratic integrity and reliable information.","actores":"TSE; digital platforms; partner institutions; civil society (as per agreements).","nivelDetalle":"National","anioTexto":"2018–present","paisDetalle":"Brazil","institucion":"Superior Electoral Court (TSE)","comentarios":"Experience replicable by electoral authorities in prevention and response strategies against fake news."}},{"id":73,"dimensionId":"comunicacional","pais":"BR","nivel":"Subnacional","anio":2024,"vinculadaPNUD":false,"destacada":false,"fuentes":[{"label":{"es":"tjce.jus.br","en":"tjce.jus.br"},"url":"https://www.tjce.jus.br/noticias/unidades-de-execucao-penal-passam-a-utilizar-linguagem-simplificada-para-reduzir-regressoes-de-regime/"}],"es":{"titulo":"“Linguagem Reduzindo a Regressão Penal” (Lenguaje claro en fase de ejecución penal)","resumen":"Iniciativa del laboratorio de innovación LabLuz que aplica lenguaje claro y derecho visual a las comunicaciones de ejecución penal en Ceará, rediseñando documentos y mensajes dirigidos a personas en régimen semiabierto para que comprendan con claridad sus obligaciones, mediante frases cortas, vocabulario directo, ejemplos prácticos, apoyos visuales y una tarjeta física de referencia entregada en audiencia. tjce+1","buenaPractica":"Uso de  de mejora continua."},"en":{"titulo":"Institutional Integrity System (CGR Chile)","resumen":"System developed by the CGR since 2017: a set of regulations and initiatives to promote and strengthen the integrity of all public officials and reduce corruption risks","buenaPractica":"Comprehensive model with a dedicated structure (Integrity Officer; Higher Council for Integrity) and four lines of work: regulatory, training, operational (inquiries/complaints and management), and risk management.","actores":"CGR Chile","nivelDetalle":"National","anioTexto":"2017–present","paisDetalle":"Chile","institucion":"Comptroller General of the Republic (CGR)","comentarios":"It includes components such as a Code of Ethics and Conduct, training/capacity-building and channels for inquiries/complaints, with a continuous improvement approach."}},{"id":84,"dimensionId":"integra","pais":"CO","nivel":"Nacional","anio":2025,"vinculadaPNUD":false,"destacada":false,"fuentes":[{"label":{"es":"colombiacompra.gov.co","en":"colombiacompra.gov.co"},"url":"https://www.colombiacompra.gov.co/secop/secop-ii"}],"es":{"titulo":"SECOP II (Sistema Electrónico para la Contratación Pública)","resumen":"Plataforma de contratación pública en línea para publicar y gestionar procesos, contribuyendo a transparencia de la compra pública.","buenaPractica":"Digitaliza y visibiliza procesos de contratación, facilitando control social y acceso a información de compras públicas.","actores":"Colombia Compra Eficiente; entidades contratantes; proveedores; ciudadanía/observación.","nivelDetalle":"Nacional","anioTexto":"(plataforma vigente)","paisDetalle":"Colombia","institucion":"Agencia Nacional de Contratación Pública – Colombia Compra Eficiente","comentarios":"Cruza con D5 (transformación digital) y con políticas de datos abiertos de compra pública."},"en":{"titulo":"SECOP II (Electronic System for Public Procurement)","resumen":"Online public procurement platform to publish and manage processes, contributing to transparency in public procurement.","buenaPractica":"Digitizes and makes procurement processes transparent, facilitating public oversight and access to public procurement information.","actores":"Colombia Compra Eficiente; contracting entities; suppliers; citizens/observers.","nivelDetalle":"National","anioTexto":"(current platform)","paisDetalle":"Colombia","institucion":"National Public Procurement Agency – Colombia Compra Eficiente","comentarios":"It crosses with D5 (digital transformation) and with open data policies for public procurement."}},{"id":85,"dimensionId":"integra","pais":"CO","nivel":"Local","anio":2023,"vinculadaPNUD":false,"destacada":false,"fuentes":[{"label":{"es":"colaboralab.bucaramanga.gov.co","en":"colaboralab.bucaramanga.gov.co"},"url":"https://colaboralab.bucaramanga.gov.co/quienes-somos/"}],"es":{"titulo":"CoLabora – Laboratorio de Innovación Pública de Bucaramanga","resumen":"CoLabora es el Laboratorio de Innovación Pública de la Alcaldía de Bucaramanga, creado como estrategia para impulsar transparencia, participación e innovación en la gestión municipal. Está liderado por el Proyecto de Transparencia y Lucha contra la Corrupción de la Secretaría Jurídica y se alinea con la Política Pública de Transparencia y Anticorrupción 2023–2033 y con el Plan de Desarrollo “Bucaramanga Avanza Segura” 2024–2027. Funciona como espacio de co‑diseño entre equipos municipales, academia y ciudadanía organizada.","buenaPractica":"Opera como un mecanismo estructural de transparencia en el que la comunicación es bidireccional: traduce la gestión pública a lenguajes y formatos accesibles, abre espacios para que la ciudadanía entienda cómo se decide, cuestione y proponga, y devuelve resultados, fortaleciendo integridad y confianza institucional.","actores":"Alcaldía de Bucaramanga (equipos de innovación, planeación y comunicación); universidades locales; ciudadanía organizada; organizaciones sociales que participaron en el co‑diseño del laboratorio.","nivelDetalle":"Municipal","anioTexto":"Desde 2023","paisDetalle":"Colombia","institucion":"Alcaldía de Bucaramanga","comentarios":"Ejemplo de laboratorio de innovación pública municipal que integra transparencia, participación e innovación como parte de la arquitectura institucional, más allá de proyectos puntuales o cambios de administración."},"en":{"titulo":"CoLabora – Bucaramanga Public Innovation Lab","resumen":"CoLabora is the Public Innovation Lab of the Bucaramanga Mayor’s Office, created as a strategy to promote transparency, participation, and innovation in municipal governance. It is led by the Transparency and Anti-Corruption Project of the Legal Secretariat and aligns with the 2023–2033 Public Policy on Transparency and Anti-Corruption and the “Bucaramanga Avanza Segura” 2024–2027 Development Plan. It functions as a co-design space between municipal teams, academia, and organized citizens.","buenaPractica":"It operates as a structural mechanism for transparency in which communication is two-way: it translates public administration into accessible languages and formats, creates spaces for citizens to understand how decisions are made, to ask questions and make proposals, and to receive feedback, thereby strengthening institutional integrity and trust.","actores":"Bucaramanga Mayor’s Office (innovation, planning, and communication teams); local universities; organized citizens; social organizations that participated in the co-design of the lab.","nivelDetalle":"Municipal","anioTexto":"Since 2023","paisDetalle":"Colombia","institucion":"Bucaramanga City Hall","comentarios":"Example of a municipal public innovation laboratory that integrates transparency, participation and innovation as part of the institutional architecture, beyond one-off projects or changes of administration."}},{"id":86,"dimensionId":"integra","pais":"MX","nivel":"Nacional","anio":2020,"vinculadaPNUD":false,"destacada":false,"fuentes":[{"label":{"es":"OPSI / OCDE","en":"OPSI / OECD"},"url":"https:/ sing traceability and access.","buenaPractica":"Digitization of judicial processes to improve access, processing times, and tracking, with a user-centered approach.","actores":"Judicial Branch; OAS/DGPE (PIGEP) and technical teams.","nivelDetalle":"National","anioTexto":"2024 (PIGEP)","paisDetalle":"Colombia","institucion":"Judicial Branch (Colombia)","comentarios":"Strong case for D5 (digital justice)."}},{"id":94,"dimensionId":"digital","pais":"CO","nivel":"Nacional","anio":2021,"vinculadaPNUD":false,"destacada":false,"fuentes":[{"label":{"es":"gobiernodigital.mintic.gov.co","en":"gobiernodigital.mintic.gov.co"},"url":"https://gobiernodigital.mintic.gov.co/692/w3-article-272779.html"}],"es":{"titulo":"Carpeta Ciudadana Digital (Servicios Ciudadanos Digitales)","resumen":"Servicio que permite a personas acceder a su información y documentos disponibles en entidades públicas para trámites en línea, articulado con GOV.CO.","buenaPractica":"Interoperabilidad y experiencia usuaria: reduce fricción en trámites y habilita servicios más integrados.","actores":"MinTIC; entidades públicas que proveen datos; ciudadanía usuaria; plataforma GOV.CO.","nivelDetalle":"Nacional","anioTexto":"2021–actualidad","paisDetalle":"Colombia","institucion":"Ministerio TIC (MinTIC) / Gobierno Digital","comentarios":"Relevante para ‘servicios proactivos’ y rediseño de trámites con enfoque de vida de las personas."},"en":{"titulo":"Digital Citizen Folder (Digital Citizen Services)","resumen":"Service that allows individuals to access their information and documents held by public entities for online procedures, integrated with GOV.CO.","buenaPractica":"Interoperability and user experience: reduces friction in procedures and enables more integrated services.","actores":"MinTIC; public entities that provide data; citizen users; GOV.CO platform.","nivelDetalle":"National","anioTexto":"2021–present","paisDetalle":"Colombia","institucion":"Ministry of ICT (MinTIC) / Digital Government","comentarios oTexto":"2024 (PIGEP)","paisDetalle":"Peru","institucion":"National Penitentiary Institute (INPE)","comentarios":"Cross-reference with D4 (transparency) for open data."}},{"id":98,"dimensionId":"digital","pais":"PE","nivel":"Nacional","anio":2024,"vinculadaPNUD":false,"destacada":false,"fuentes":[{"label":{"es":"oas.org","en":"oas.org"},"url":"https://www.oas.org/ext/es/principal/calendario/evento/moduleid/14104/id/546/lang/2/controller/item/action/eventdownload"}],"es":{"titulo":"Menos interrupciones del servicio eléctrico usando IA","resumen":"Uso de inteligencia artificial para prevenir y reducir interrupciones del servicio eléctrico, mejorando operación y respuesta.","buenaPractica":"IA aplicada a la gestión pública para mejorar continuidad y calidad del servicio, con foco en resultados para personas usuarias.","actores":"Osinergmin; OEA/DGPE (PIGEP) y aliados técnicos.","nivelDetalle":"Nacional","anioTexto":"2024 (PIGEP)","paisDetalle":"Perú","institucion":"Osinergmin","comentarios":"Buen ejemplo de IA aplicada a servicios regulados."},"en":{"titulo":"Fewer power outages using AI","resumen":"Use of artificial intelligence to prevent and reduce power outages, improving operations and response.","buenaPractica":"AI applied to public management to improve service continuity and quality, with a focus on results for users.","actores":"Osinergmin; OAS/DGPE (PIGEP) and technical partners.","nivelDetalle":"National","anioTexto":"2024 (PIGEP)","paisDetalle":"Peru","institucion":"Osinergmin","comentarios":"Good example of AI applied to regulated services."}},{"id":99,"dimensionId":"digital","pais":"PE","nivel":"Nacional","anio":2026,"vinculadaPNUD":false,"destacada":false,"fuentes":[{"label":{"es":"gob.pe","en":"gob.pe"},"url":"https://www.gob.pe/servir"}],"es":{"titulo":"Minisite “ORH Informa” (SERVIR)","resumen":"Canal digital interno para centralizar información, documentos y novedades de la ORH, promoviendo interacción y mejorando el acceso del personal a contenidos de gestión de personas (beneficios, procesos, lineamientos, actividades).","buenaPractica":"Digitalización de la comunicación interna como palanca de eficiencia y experiencia de usuarias/os internos: repositorio único, acceso oportuno y trazabilidad de información clave.","actores":"SERVIR – ORH; servidoras/es públicos de la institución.","nivelDetalle":"Nacional","anioTexto":"2025–2026 (en curso)","paisDetalle":"Perú","institucion":"Autoridad Nacional del Servicio Civil – SERVIR (Oficina de Recursos Humanos)","comentarios":"Dimensión secundaria: Nuevas prácticas de comunicación pública (comunicación interna institucional)."},"en":{"titulo":"“ORH Informa” Microsite (SERVIR)","resumen":"Internal digital channel to centralize information, documents, and updates from the ORH, promoting interaction and improving staff access to people management content (benefits, processes, guidelines, activities).","buenaPractica":"Digitization of internal communication as a driver of efficiency and the internal user experience: single repository, timely access, and traceability of key information.","actores":"SERVIR – HR Department; public servants of the institution.","nivelDetalle":"National","anioTexto":"2025–2026 (ongoing)","paisDetalle":"Peru","institucion":"National Civil Service Authority – SERVIR (Human Resources Office)","comentarios":"Secondary dimension: New public communication practices (internal institutional communication)."}},{"id":100,"dimensionId":"digital","pais":"DO","nivel":"Nacional","anio":2025,"vinculadaPNUD":false,"destacada":false,"fuentes":[{"label":{"es":"ogtic.gob.do","en":"ogtic.gob.do"},"url":"https://ogtic.gob.do/portal-de-servicios-del-gobierno-dominicano/"}],"es":{"titulo":"Portal de Servicios del Gobierno Dominicano","resumen":"Plataforma web que reúne servicios del Estado de forma digital para facilitar acceso y entrega a la ciudadanía.","buenaPractica":"Punto único de entrada a servicios digitales; facilita navegación y acceso a oferta pública.","actores":"OGTIC; instituciones proveedoras de servicios; ciudadanía usuaria.","nivelDetalle":"Nacional","anioTexto":"plataforma vigente","paisDetalle":"República Dominicana","institucion":"OGTIC (Oficina Gubernamental de Tecnologías de la Información y Comunicaciones)","comentarios":"Puede conectarse con estándares de ‘gobierno digital’ (catálogo de servicios, interoperabilidad, puntos GOB)."},"en":{"titulo":"Dominican Government Services Portal","resumen":"Web platform that brings together government services digitally to facilitate access and delivery to citizens.","buenaPractica":"Single point of entry to digital services; facilitates navigation and access to public offerings.","actores":"OGTIC; service-providing institutions; citizen users.","nivelDetalle":"National","anioTexto":"Platform in effect","paisDetalle":"Dominican Republic","institucion":"OGTIC (Government Office of Information and Communication Technologies)","comentarios":"It can be connected with 'digital government' standards (service catalogue, interoperability, GOB points)."}},{"id":101,"dimensionId":"digital","pais":"UY","nivel":"Nacional","anio":2022,"vinculadaPNUD":false,"destacada":false,"fuentes":[{"label":{"es":"OPSI / OCDE","en":"OPSI / OECD"},"url":"https://oecd-opsi.org/innovations/ai-service-requests-classification/"}],"es":{"titulo":"Inteligencia artificial para la clasificación de solicitudes en la ventanilla de atención a la ciudadanía","resumen":"Solución con IA/NLP para clasificar solicitudes en la mesa de servicios y mejorar tiempos de respuesta.","buenaPractica":"Uso práctico de IA para simplificación de procesos y mejora de servicios públicos.","actores":"AGESIC; ClusterUY; Presidencia de Uruguay.","nivelDetalle":"Nacional","anioTexto":"2022–actualidad","paisDetalle":"Uruguay","institucion":"AGESIC","comentarios":"Caso muy útil para subdimensión de IA aplicada a gestión pública. Esta experiencia la tengo en la hoja PNUD"},"en":{"titulo":"Artificial Intelligence for Classifying R
