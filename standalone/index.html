equests at the Citizen Service Counter","resumen":"AI/NLP solution to classify requests at the service desk and improve response times.","buenaPractica":"Practical use of AI to streamline processes and improve public services.","actores":"AGESIC; ClusterUY; Office of the President of Uruguay.","nivelDetalle":"National","anioTexto":"2022–present","paisDetalle":"Uruguay","institucion":"AGESIC","comentarios":"Very useful case for the subdimension on AI applied to public management. I have this experience in the UNDP sheet"}},{"id":102,"dimensionId":"intergeneracional","pais":"CL","nivel":"Nacional","anio":2022,"vinculadaPNUD":false,"destacada":false,"fuentes":[{"label":{"es":"parlamericas.org","en":"parlamericas.org"},"url":"https://parlamericas.org/uploads/documents/Publication-IntergenerationalApproaches-LegislativeWork-sp.pdf"}],"es":{"titulo":"Marco de Cambio Climático de Chile (Ley 21.455) – dimensión intergeneracional","resumen":"Ley de Marco de Cambio Climático que establece metas de neutralidad de carbono y resiliencia, e incorpora elementos intergeneracionales al buscar evitar miopía política y daños a largo plazo. La herramienta de ParlAmericas la destaca como ejemplo de legislación que integra educación, resiliencia climática y equidad económica con visión de largo plazo, y que puede apoyarse en evaluaciones de impacto intergeneracional para orientar políticas y supervisión parlamentaria.","buenaPractica":"Uso de un marco legal climático de largo plazo que orienta decisiones presentes considerando efectos sobre generaciones futuras, combinando metas de neutralidad, educación climática y resiliencia; sirve como referencia para incorporar análisis intergeneracional en otras leyes sectoriales.","actores":"Congreso Nacional de Chile; Ministerio de Medio Ambiente; comisiones parlamentarias de medio ambiente y cambio climático.","nivelDetalle":"Nacional","anioTexto":"Desde 2022 (vigente)","paisDetalle":"Chile","institucion":"Congreso Nacional de Chile + Gobierno de Chile","comentarios":"Es un caso sectorial (clima), es útil para tu matriz como ejemplo de cómo un parlamento introduce obligaciones legales de largo plazo y criterios de justicia entre generaciones en una ley marco."},"en":{"titulo":"Chilean Climate Change Framework (Law 21,455) – intergenerational dimension","resumen":"Climate Change Framework Law that establishes carbon neutrality and resilience targets, and incorporates intergenerational elements by seeking to avoid political myopia and long-term harm. The ParlAmericas tool highlights it as an example of legislation that integrates education, climate resilience, and economic equity with a long-term vision, and that can rely on intergenerational impact assessments to guide policies and parliamentary oversight.","buenaPractica":"Use of a long-term climate legal framework that guides current decisions by considering effects on future generations, combining goals of carbon neutrality, climate education, and resilience; serves as a reference for incorporating intergenerational analysis into other sectoral laws.","actores":"Chilean National Congress; Ministry of the Environment; parliamentary committees on the environment and climate change.","nivelDetalle":"National","anioTexto":"Since 2022 (in effect)","paisDetalle":"Chile","institucion":"National Congress of Chile + Government of Chile","comentarios":"It is a sectoral case (climate); it is useful for your matrix as an example of how a parliament introduces long-term legal obligations and intergenerational justice criteria into a framework law."}},{"id":103,"dimensionId":"intergeneracional","pais":"EC","nivel":"Nacional","anio":2025,"vinculadaPNUD":false,"destacada":false,"fuentes":[{"label":{"es":"igualdad.gob.ec","en":"igualdad.gob.ec"},"url":"https://www.igualdad.gob.ec/wp-content/uploads/downloads/2022/04/ANII_2021-2025-signed.pdf"}],"es":{"titulo":"Agenda Nacional para la Igualdad Intergeneracional (ANII) 2021–2025","resumen":"Proceso liderado por el CNII en el que se diseñó una agenda nacional para la igualdad intergeneracional, con participación de consejos consultivos generacionales (niñez, adolescencia, juventudes, personas adultas mayores). La agenda promueve relaciones intergeneracionales solidarias, espacios específicos de diálogo entre grupos de edad y lineamientos para que las políticas públicas incorporen la perspectiva intergeneracional en programas y servicios del Estado.","buenaPractica":"Institucionalizar un órgano rector de igualdad intergeneracional y consejos consultivos por generación, que sirven como mecanismos permanentes de participación, diálogo y co-diseño de políticas desde una lógica de solidaridad entre generaciones.","actores":"Consejo Nacional para la Igualdad Intergeneracional; ministerios sectoriales; consejos consultivos de niñas, niños, adolescentes, jóvenes y personas mayores.","nivelDetalle":"Nacional","anioTexto":"2021–2025","paisDetalle":"Ecuador","institucion":"Consejo Nacional para la Igualdad Intergeneracional (CNII)","comentarios":"Es un ejemplo fuerte de arquitectura institucional de equidad intergeneracional con mecanismos participativos diferenciados; puede ilustrar tu acelerador de gobernanza intergeneracional a nivel ejecutivo."},"en":{"titulo":"National Agenda for Intergenerational Equality (ANII) 2021–2025","resumen":"A process led by the CNII in which a national agenda for intergenerational equality was designed, with the participation of generational advisory councils (children, adolescents, youth, older adults). The agenda promotes intergenerational solidarity, specific spaces for dialogue between age groups, and guidelines for public policies to incorporate the intergenerational perspective into government programs and services.","buenaPractica":"Institutionalize a governing body for intergenerational equality and generational advisory councils, which serve as permanent mechanisms for participation, dialogue, and co-design of policies based on solidarity among generations.","actores":"National Council for Intergenerational Equality; sectoral ministries; advisory councils for children, adolescents, youth, and older adults.","nivelDetalle":"National","anioTexto":"2021–2025","paisDetalle":"Ecuador","institucion":"National Council for Intergenerational Equality (CNII)","comentarios":"It is a strong example of institutional architecture for intergenerational equity with differentiated participatory mechanisms; it can illustrate your intergenerational governance accelerator at the executive level."}},{"id":104,"dimensionId":"intergeneracional","pais":"TT","nivel":"Nacional","anio":2016,"vinculadaPNUD":false,"destacada":false,"fuentes":[{"label":{"es":"parlamericas.org","en":"parlamericas.org"},"url":"https://parlamericas.org/uploads/documents/Publication-IntergenerationalApproaches-LegislativeWork-sp.pdf"}],"es":{"titulo":"Comité Selecto Conjunto sobre Visión 2030","resumen":"La herramienta de ParlAmericas documenta cómo el Parlamento de Trinidad y Tobago conformó un Comité Selecto Conjunto para revisar y analizar una estrategia de desarrollo de largo plazo “Visión 2030”, considerando recomendaciones sobre sostenibilidad económica, social y ambiental. Este enfoque permite que el poder legislativo supervise la coherencia de las políticas con los objetivos de largo plazo y los impactos sobre generaciones presentes y futuras.","buenaPractica":"Establecer comités parlamentarios que analicen planes de desarrollo de largo plazo desde una perspectiva intergeneracional, fortaleciendo la supervisión y obligando a que los grandes planes nacionales expliciten sus impactos sobre distintas generaciones.","actores":"Parlamento de Trinidad y Tobago; comisiones y comités selectos; ministerios responsables de la estrategia Visión 2030.","nivelDetalle":"Nacional","anioTexto":"Desde 2016","paisDetalle":"Trinidad y Tobago","institucion":"Parlamento de Trinidad y Tobago"},"en":{"titulo":"Joint Select Committee on Vision 2030","resumen":"The ParlAmericas tool documents how the Parliament of Trinidad and Tobago established a Joint Select Committee to review and analyze a long-term development strategy, “Vision 2030,” taking into account recommendations on economic, social, and environmental sustainability. This approach allows the legislative branch to oversee the alignment of policies with long-term objectives and their impacts on present and future generations.","buenaPractica":"Establish parliamentary committees to analyze long-term development plans from an intergenerational perspective, strengthening oversight and requiring major national plans to explicitly state their impacts on different generations.","actores":"Parliament of Trinidad and Tobago; select committees and commissions; ministries responsible for the Vision 2030 strategy.","nivelDetalle":"National","anioTexto":"Since 2016","paisDetalle":"Trinidad and Tobago","institucion":"Parliament of Trinidad and Tobago"}},{"id":105,"dimensionId":"anticipatoria","pais":"CL","nivel":"Nacional","anio":2024,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"subdere.gov.cl","en":"subdere.gov.cl"},"url":"https://www.subdere.gov.cl/sites/default/files/0213%20Informe%20PNUD%2C%20Proceso%20Participativo%20SUBDERE.pdf"},{"label":{"es":"subdere.gov.cl","en":"subdere.gov.cl"},"url":"https://www.subdere.gov.cl/sites/default/files/Politica-descentralizacion-chile-digital.pdf"}],"es":{"titulo":"Proceso participativo para la elaboración de la Política de Descentralización de Chile","resumen":"Realización de un proceso participativo en todas las regiones del país para la construcción de una política de descentralización de Chile","buenaPractica":"Proceso participativo amplio y con diversos actores, desplegado a lo largo de las 16 regiones del país con el objetivo de facilitar espacios ciudadanos para el debate sobre la visión de futuro del territorio y la identificación de medidas descentralizadoras clave, en un horizonte de planificación que trasciende las distintas administraciones de gobierno y que se constituye como una guía para la acción del Estado para los siguientes diez años.","actores":"PNUD (acompañamiento), SUBDERE, actores de las comunidades, sociedad civil, sectores productivos y otros de todas las regiones del país.","nivelDetalle":"Nacional","anioTexto":"2024","paisDetalle":"Chile","institucion":"Subsecretaría de Desarrollo Regional y Administrativo (SUBDERE) (Chile)"},"en":{"titulo":"Participatory process for the development of Chile's Decentralization Policy","resumen":"Implementation of a participatory process in all regions of the country for the construction of a decentralization policy for Chile","buenaPractica":"Broad participatory process involving diverse actors, deployed across the country's 16 regions with the aim of facilitating citizen spaces for debate on the territory's vision of the future and the identification of key decentralization measures, within a planning horizon that transcends successive government administrations and serves as a guide for State action over the next ten years.","actores":"UNDP (support), SUBDERE, community actors, civil society, productive sectors, and others from all regions of the country.","nivelDetalle":"National","anioTexto":"2024","paisDetalle":"Chile","institucion":"Subsecretaría de Desarrollo Regional y Administrativo (SUBDERE) (Chile)"}},{"id":106,"dimensionId":"anticipatoria","pais":"CL","nivel":"Subnacional","anio":2023,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"gobiernovalparaiso.cl","en":"gobiernovalparaiso.cl"},"url":"https://www.gobiernovalparaiso.cl/estrategiaRegional.php"}],"es":{"titulo":"Generación de insumos para la elaboración de la Estrategia Regional de Desarrollo (ERD) de Valparaíso 2025 - 2035","resumen":"Proceso amplio participativo amplio a nivel territorial para elaborar la ERD.","buenaPractica":"Proceso participativo a lo largo de toda la región, incluido los territorios insulares de Rapa Nui y Juan Fernández en que se aplicaron metodologías prospectivas y levantamiento de escenarios de futuro para diseñar la Estrategia Regional de Desarrollo 2025-2035.","actores":"PNUD (acompañamiento en el proceso), Gobierno Regional de Valparaíso, Consejo Regional, organizaciones de la sociedad civil y actores de todos los sectores en los distintos territorios de la Región de Valparaíso (participación de más de 1.600 personas).","nivelDetalle":"Regional","anioTexto":"2023","paisDetalle":"Chile","institucion":"Gobierno Regional de Valparaíso (Chile)"},"en":{"titulo":"Generation of inputs for the development of the Valparaíso Regional Development Strategy (ERD) 2025 - 2035","resumen":"Broad participatory process at the territorial level to develop the ERD.","buenaPractica":"Participatory process across the entire region, including the island territories of Rapa Nui and Juan Fernández, in which foresight methodologies and the mapping of future scenarios were applied to design the Regional Development Strategy 2025-2035.","actores":"UNDP (support throughout the process), Regional Government of Valparaíso, Regional Council, civil society organizations, and actors from all sectors across the different territories of the Valparaíso Region (participation of more than 1,600 people).","nivelDetalle":"Regional","anioTexto":"2023","paisDetalle":"Chile","institucion":"Regional Government of Valparaíso (Chile)"}},{"id":107,"dimensionId":"anticipatoria","pais":"MX","nivel":"Local","anio":2026,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"codesin.mx","en":"codesin.mx"},"url":"https://codesin.mx/sinaloa10mas"}],"es":{"titulo":"Plan Económico Sinaloa 2050: construcción participativa de una visión de desarrollo de largo plazo","resumen":"Proceso impulsado por CODESIN con acompañamiento técnico del PNUD para construir una visión compartida del desarrollo de Sinaloa hacia 2050. La iniciativa combina análisis de tendencias y megatendencias globales, diagnóstico territorial, fortalecimiento de capacidades en prospectiva y mecanismos de diálogo multisectorial para identificar retos, oportunidades y prioridades estratégicas para el futuro del estado.","buenaPractica":"Incorporación de herramientas de prospectiva y gobernanza anticipatoria en un ejercicio de planeación territorial de largo plazo, articulando a actores del sector público, privado, académico y social alrededor de una visión compartida del futuro. El proceso busca fortalecer la capacidad institucional para anticipar cambios estructurales, reducir la toma de decisiones reactiva y promover estrategias más resilientes y sostenibles.","actores":"Consejo para el Desarrollo Económico de Sinaloa (CODESIN); Equipo Técnico Multisectorial (ETM) del Plan Sinaloa 2050 integrado por representantes y personas expertas locales de instituciones académicas, sector empresarial, gobiernos locales y organizaciones de la sociedad civil participantes en los procesos de consulta y diálogo.","nivelDetalle":"Local","anioTexto":"Febrero - Septiembre 2026 (actual)","paisDetalle":"México","institucion":"Consejo para el Desarrollo Económico de Sinaloa (CODESIN)","comentarios":"La experiencia representa una aplicación práctica de enfoques de prospectiva estratégica en el ámbito subnacional. Destaca por combinar generación de evidencia, fortalecimiento de capacidades y procesos participativos para incorporar una perspectiva de largo plazo en la definición de prioridades de desarrollo territorial. Su metodología puede servir como referencia para otros estados interesados en integrar la anticipación estratégica en sus procesos de planeación."},"en":{"titulo":"Plan Económico Sinaloa 2050: participatory construction of a long-term development vision","resumen":"Process driven by CODESIN with technical support from UNDP to build a shared vision of Sinaloa's development toward 2050. The initiative combines analysis of global trends and megatrends, territorial diagnosis, capacity building in foresight, and multisectoral dialogue mechanisms to identify challenges, opportunities, and strategic priorities for the state's future.","buenaPractica":"Incorporation of foresight and anticipatory governance tools into a long-term territorial planning exercise, bringing together actors from the public, private, academic, and social sectors around a shared vision of the future. The process seeks to strengthen institutional capacity to anticipate structural changes, reduce reactive decision-making, and promote more resilient and sustainable strategies.","actores":"Consejo para el Desarrollo Económico de Sinaloa (CODESIN); Multisectoral Technical Team (ETM) of the Plan Sinaloa 2050, composed of representatives and local experts from academic institutions, the business sector, local governments, and civil society organizations participating in the consultation and dialogue processes.","nivelDetalle":"Local","anioTexto":"February - September 2026 (ongoing)","paisDetalle":"Mexico","institucion":"Consejo para el Desarrollo Económico de Sinaloa (CODESIN)","comentarios":"The experience represents a practical application of strategic foresight approaches at the subnational level. It stands out for combining evidence generation, capacity building, and participatory processes to incorporate a long-term perspective into the definition of territorial development priorities. Its methodology can serve as a reference for other states interested in integrating strategic anticipation into their planning processes."}},{"id":108,"dimensionId":"anticipatoria","pais":"PE","nivel":"Nacional","anio":2023,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"gob.pe","en":"gob.pe"},"url":"https://www.gob.pe/institucion/pcm/informes-publicaciones/5146541-politica-nacional-multisectorial-de-descentralizacion-pnmd"}],"es":{"titulo":"Proyecto Gestión Territorial del Desarrollo","resumen":"El proyecto busca fortalecer el proceso de descentralización del Estado mediante instrumentos de coordinación multinivel y capacidades fortalecidas desde un enfoque territorial. En este marco, se ha brindado asistencia técnica a diversos procesos, entre ellos, la formulación de la Política Nacional Multisectorial de Descentralización.","buenaPractica":"Incorporación de una visión estratégica de largo plazo, proyectada al 2040, para orientar la gobernanza territorial y el proceso de descentralización. La experiencia promueve la coordinación multinivel y multisectorial así como la planificación estratégica con insumos de la planificación de gobiernos regionales, locales y sectores; gestión territorial y coordinación multinivel. Se ha generado alrededor de 40 espacios participativos de consulta y diálogo con actores nacionales y subnacionales.","actores":"PNUD, Secretaría de Descentralización de la PCM, gobiernos regionales y locales, actores territoriales.","nivelDetalle":"Nacional y regiones","anioTexto":"Desde 2023","paisDetalle":"Perú","institucion":"Presidencia del Consejo de Ministros (PCM)"},"en":{"titulo":"Territorial Development Management Project","resumen":"The project seeks to strengthen the State's decentralization process through multilevel coordination instruments and strengthened capacities from a territorial approach. Within this framework, technical assistance has been provided to various processes, including the formulation of the National Multisectoral Decentralization Policy.","buenaPractica":"Incorporation of a long-term strategic vision, projected to 2040, to guide territorial governance and the decentralization process. The experience promotes multilevel and multisectoral coordination as well as strategic planning with inputs from the planning of regional and local governments and sectors; territorial management and multilevel coordination. Around 40 participatory spaces for consultation and dialogue have been generated with national and subnational actors.","actores":"UNDP, Decentralization Secretariat of the PCM, regional and local governments, territorial actors.","nivelDetalle":"National and regions","anioTexto":"Since 2023","paisDetalle":"Peru","institucion":"Presidencia del Consejo de Ministros (PCM)"}},{"id":109,"dimensionId":"anticipatoria","pais":"PE","nivel":"Nacional","anio":2017,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/peru/noticias/consulta-ciudadana-construyendo-la-primera-politica-nacional-multisectorial-de-prevencion-y-gestion-de-conflictos-sociales-en-el-peru"},{"label":{"es":"gob.pe","en":"gob.pe"},"url":"https://www.gob.pe/institucion/pcm/informes-publicaciones/6223405-politica-nacional-multisectorial-de-prevencion-y-gestion-de-conflictos-sociales-sgsd"},{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/peru/noticias/las-oficinas-de-dialogo-en-gobiernos-regionales-son-la-primera-respuesta-del-estado-para-la-atencion-de-los-conflictos-sociales"}],"es":{"titulo":"Proyecto Gestión Social y Diálogo Multiactor","resumen":"Busca fortalecer las capacidades del Estado para prevenir y gestionar conflictos sociales, así como apoyar el diseño e implementación de la Política Nacional Multisectorial de Prevención y Gestión de Conflictos Sociales.","buenaPractica":"La experiencia articula el diseño participativo de una política nacional, a través de consultas ciudadanas descentralizadas, con el fortalecimiento territorial de capacidades e instrumentos para la prevención de conflictos sociales, tales como sistemas de alerta temprana y gestión de información para mejorar las tipologías de conflictos y protocolos de respuesta; reforzamiento de oficinas de diálogo y prevención de conflictos en gobiernos regionales.","actores":"PNUD, Secretaría de Gestión Social y Diálogo de la PCM, gobiernos regionales","nivelDetalle":"Nacional y regiones","anioTexto":"Desde 2017","paisDetalle":"Perú","institucion":"Presidencia del Consejo de Ministros (PCM)"},"en":{"titulo":"Social Management and Multi-Stakeholder Dialogue Project","resumen":"Seeks to strengthen the State's capacities to prevent and manage social conflicts, as well as to support the design and implementation of the National Multisectoral Policy for the Prevention and Management of Social Conflicts.","buenaPractica":"The experience links the participatory design of a national policy, through decentralized citizen consultations, with the territorial strengthening of capacities and instruments for the prevention of social conflicts, such as early warning systems and information management to improve conflict typologies and response protocols; and the reinforcement of dialogue and conflict prevention offices in regional governments.","actores":"UNDP, Secretariat for Social Management and Dialogue of the PCM, regional governments","nivelDetalle":"National and regions","anioTexto":"Since 2017","paisDetalle":"Peru","institucion":"Presidencia del Consejo de Ministros (PCM)"}},{"id":110,"dimensionId":"anticipatoria","pais":"PE","nivel":"Nacional","anio":2017,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"acuerdonacional.pe","en":"acuerdonacional.pe"},"url":"https://acuerdonacional.pe/"},{"label":{"es":"acuerdonacional.pe","en":"acuerdonacional.pe"},"url":"https://acuerdonacional.pe/sesion-134-del-foro-del-acuerdo-nacional-aprobo-documento-sobre-lucha-contra-la-inseguridad-ciudadana-y-el-crimen-organizado/"},{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/peru/noticias/un-pacto-por-el-peru"}],"es":{"titulo":"Proyecto Promoción del Diálogo y Consolidación del Acuerdo Nacional","resumen":"Promoción del diálogo político y construcción de consensos en el marco del Acuerdo Nacional sobre temas prioritarios para la gobernabilidad democrática y el desarrollo del país.","buenaPractica":"El Acuerdo Nacional, siendo la plataforma nacional de concertación, sostiene espacios de diálogo, tanto formales como informales, en los que se anticipa y aborda desafíos estratégicos de interés nacional, promoviendo acuerdos políticos que buscan orientar respuestas al mediano y largo plazo.","actores":"PNUD, Secretaría Nacional del Acuerdo Nacional (PCM), autoridades y sectores, organizaciones sociales, partidos políticos, entre otros","nivelDetalle":"Nacional y regiones","anioTexto":"Desde 2017","paisDetalle":"Perú","institucion":"Presidencia del Consejo de Ministros (PCM)"},"en":{"titulo":"Project for the Promotion of Dialogue and Consolidation of the Acuerdo Nacional","resumen":"Promotion of political dialogue and consensus building within the framework of the Acuerdo Nacional on priority issues for democratic governance and the country's development.","buenaPractica":"The Acuerdo Nacional, as the national consensus-building platform, sustains spaces for dialogue, both formal and informal, in which strategic challenges of national interest are anticipated and addressed, promoting political agreements that seek to guide medium- and long-term responses.","actores":"UNDP, National Secretariat of the Acuerdo Nacional (PCM), authorities and sectors, social organizations, political parties, among others","nivelDetalle":"National and regions","anioTexto":"Since 2017","paisDetalle":"Peru","institucion":"Presidencia del Consejo de Ministros (PCM)"}},{"id":111,"dimensionId":"anticipatoria","pais":"DO","nivel":"Nacional","anio":2026,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"poderjudicial.gob.do","en":"poderjudicial.gob.do"},"url":"https://poderjudicial.gob.do/pj/"}],"es":{"titulo":"Ejercicio de Futuros para la Justicia Dominicana","resumen":"Aplicación de metodologías de prospectiva estratégica para identificar escenarios futuros de la justicia, riesgos emergentes y capacidades institucionales necesarias para la transformación del sistema judicial.","buenaPractica":"Introducción de gobernanza anticipatoria y pensamiento de futuros en la planificación judicial.","actores":"Poder Judicial, PNUD, y participación de 2,082 actores claves de la justicia; 201 representantes de academias, sociedad civil e iglesias; 25 asistentes políticos, y 61 actores del sector empresarial.","nivelDetalle":"Nacional","anioTexto":"2025-2026","paisDetalle":"Rep. Dominicana","institucion":"Poder Judicial de República Dominicana"},"en":{"titulo":"Futures Exercise for Dominican Justice","resumen":"Application of strategic foresight methodologies to identify future scenarios for justice, emerging risks, and the institutional capacities needed for the transformation of the judicial system.","buenaPractica":"Introduction of anticipatory governance and futures thinking into judicial planning.","actores":"Judiciary, UNDP, and the participation of 2,082 key justice actors; 201 representatives from academia, civil society, and churches; 25 political aides; and 61 actors from the business sector.","nivelDetalle":"National","anioTexto":"2025-2026","paisDetalle":"Dominican Rep.","institucion":"Judiciary of the Dominican Republic"}},{"id":112,"dimensionId":"anticipatoria","pais":"DO","nivel":"Nacional","anio":2034,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"poderjudicial.gob.do","en":"poderjudicial.gob.do"},"url":"https://poderjudicial.gob.do/pj/"}],"es":{"titulo":"Plan Estratégico Decenal del Poder Judicial","resumen":"Hoja de ruta de transformación institucional orientada a modernización, digitalización, acceso a la justicia y fortalecimiento de la confianza ciudadana.","buenaPractica":"Planificación de largo plazo con indicadores de seguimiento y alineamiento a ODS 16.","actores":"PNUD, AECID, World Justice Project y Together Ideas, y se nutrió de un proceso participativo que involucró a más de 3000 actores nacionales","nivelDetalle":"Nacional","anioTexto":"2024-2034","paisDetalle":"Rep. Dominicana","institucion":"Poder Judicial de República Dominicana","comentarios":"Referente Regional en planificación judicial estratégica"},"en":{"titulo":"Ten-Year Strategic Plan of the Judiciary","resumen":"Institutional transformation roadmap focused on modernization, digitalization, access to justice, and strengthening citizen trust.","buenaPractica":"Long-term planning with monitoring indicators and alignment with SDG 16.","actores":"UNDP, AECID, World Justice Project and Together Ideas, drawing on a participatory process that involved more than 3,000 national actors","nivelDetalle":"National","anioTexto":"2024-2034","paisDetalle":"Dominican Rep.","institucion":"Judiciary of the Dominican Republic","comentarios":"Regional benchmark in strategic judicial planning"}},{"id":113,"dimensionId":"anticipatoria","pais":"DO","nivel":"Nacional","anio":2026,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"transparencia.gob.do","en":"transparencia.gob.do"},"url":"https://transparencia.gob.do/2026/01/08/ministerio-de-justicia/"}],"es":{"titulo":"Creación del Ministerio de Justicia","resumen":"Asistencia técnica para el diseño institucional, competencias y hoja de ruta para la creación de un nuevo Ministerio de Justicia.","buenaPractica":"Reordenamiento institucional del sector justicia bajo una visión de gobernanza integral.","actores":"PNUD, Ministerio de Justicia","nivelDetalle":"Nacional","anioTexto":"2025-2026","paisDetalle":"Rep. Dominicana","institucion":"Ministerio de Justicia","comentarios":"Una de las reformas institucionales más relevantes del sector justicia en el Caribe."},"en":{"titulo":"Creation of the Ministry of Justice","resumen":"Technical assistance for the institutional design, competencies, and roadmap for the creation of a new Ministry of Justice.","buenaPractica":"Institutional reorganization of the justice sector under a vision of integrated governance.","actores":"UNDP, Ministry of Justice","nivelDetalle":"National","anioTexto":"2025-2026","paisDetalle":"Dominican Rep.","institucion":"Ministry of Justice","comentarios":"One of the most significant institutional reforms of the justice sector in the Caribbean."}},{"id":114,"dimensionId":"colaborativa","pais":"BR","nivel":"Nacional","anio":2025,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"gov.br","en":"gov.br"},"url":"https://www.gov.br/mdh/pt-br/navegue-por-temas/pessoa-com-deficiencia/acoes-e-programas/5a-conferencia-nacional-dos-direitos-da-pessoa-com-deficiencia"}],"es":{"titulo":"Fortalecimiento de la participación social y del control ciudadano de las políticas para las personas con discapacidad","resumen":"Desarrollo e implementación de metodologías participativas para apoyar la formulación y el perfeccionamiento de políticas públicas dirigidas a las personas con discapacidad, incluyendo la V Conferencia Nacional de los Derechos de las Personas con Discapacidad y talleres de escucha de la sociedad civil sobre la evaluación biopsicosocial de la discapacidad. La iniciativa contempló el diseño metodológico, la movilización de actores clave, la facilitación de procesos participativos y la sistematización de contribuciones para apoyar los procesos de toma de decisiones y el desarrollo normativo.","buenaPractica":"La experiencia combina diferentes mecanismos de participación social —como conferencias nacionales, talleres temáticos y procesos de sistematización de aportes—, fortaleciendo el diálogo entre el gobierno y la sociedad civil y ampliando la incorporación de las demandas de las personas con discapacidad en la formulación de políticas públicas. Este modelo generó insumos relevantes para el perfeccionamiento de la evaluación biopsicosocial de la discapacidad y para el fortalecimiento institucional de la Secretaría Nacional de los Derechos de las Personas con Discapacidad (SNDPD).","actores":"SNDPD/MDHC, PNUD, FLACSO, CONADE, conselhos estaduais e municipais, organizações de pessoas com deficiência e sociedade civil.","nivelDetalle":"Nacional","anioTexto":"2024 - 2025","paisDetalle":"Brasil","institucion":"Ministério dos Direitos Humanos e da Cidadania","comentarios":"La experiencia apoyó la reactivación de mecanismos nacionales de participación social y amplió la escucha cualificada de la sociedad civil en procesos estratégicos para la implementación y garantía de los derechos de las personas con discapacidad."},"en":{"titulo":"Strengthening social participation and citizen oversight of policies for persons with disabilities","resumen":"Development and implementation of participatory methodologies to support the formulation and improvement of public policies aimed at persons with disabilities, including the V National Conference on the Rights of Persons with Disabilities and civil society listening workshops on the biopsychosocial assessment of disability. The initiative encompassed methodological design, the mobilization of key actors, the facilitation of participatory processes, and the systematization of contributions to support decision-making processes and regulatory development.","buenaPractica":"The experience combines different mechanisms of social participation —such as national conferences, thematic workshops, and processes for systematizing contributions— strengthening dialogue between government and civil society and expanding the incorporation of the demands of persons with disabilities into public policy formulation. This model generated relevant inputs for improving the biopsychosocial assessment of disability and for the institutional strengthening of the National Secretariat for the Rights of Persons with Disabilities (SNDPD).","actores":"SNDPD/MDHC, UNDP, FLACSO, CONADE, state and municipal councils, organizations of persons with disabilities, and civil society.","nivelDetalle":"National","anioTexto":"2024 - 2025","paisDetalle":"Brazil","institucion":"Ministério dos Direitos Humanos e da Cidadania","comentarios":"The experience supported the reactivation of national mechanisms for social participation and expanded qualified listening to civil society in strategic processes for the implementation and guarantee of the rights of persons with disabilities."}},{"id":115,"dimensionId":"colaborativa","pais":"BR","nivel":"Nacional","anio":2026,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"pontesparaconvergencia.org.br","en":"pontesparaconvergencia.org.br"},"url":"https://pontesparaconvergencia.org.br/"}],"es":{"titulo":"Pontes para Convergências","resumen":"Como parte de su estrategia para fortalecer la gobernanza democrática y promover la construcción de consensos en torno a los desafíos del desarrollo sostenible, Puentes para la Convergencia impulsó la creación de una plataforma multiactor concebida como un espacio permanente de diálogo, articulación e innovación democrática. La plataforma busca conectar a representantes del sector público, la sociedad civil, la academia, el sector privado, medios de comunicación y organizaciones juveniles para fomentar el intercambio de conocimientos, la identificación de prioridades compartidas y la formulación de soluciones colaborativas.","buenaPractica":"Como mecanismo de gobernanza de esta iniciativa, se estableció un Consejo Estratégico integrado por liderazgos de diversos sectores y trayectorias, garantizando la pluralidad de perspectivas, la representatividad y la legitimidad de los procesos de toma de decisiones. Este modelo fortalece la gobernanza colaborativa al promover la participación de múltiples actores en la definición de agendas comunes, al tiempo que contribuye a una gobernanza anticipatoria capaz de identificar tendencias, riesgos y oportunidades para el futuro de la democracia en Brasil","actores":"PNUD","nivelDetalle":"Nacional","anioTexto":"2025-2026","paisDetalle":"Brasil","institucion":"PNUD Brasil","comentarios":"Concebida como un espacio permanente de diálogo, intercambio y construcción colectiva, la plataforma busca generar consensos en torno a desafíos complejos que afectan a las democracias contemporáneas, promoviendo la colaboración entre instituciones públicas, academia, sociedad civil, sector privado, medios de comunicación y organizaciones juveniles."},"en":{"titulo":"Pontes para Convergências","resumen":"As part of its strategy to strengthen democratic governance and promote consensus building around sustainable development challenges, Pontes para Convergências promoted the creation of a multi-stakeholder platform conceived as a permanent space for dialogue, coordination, and democratic innovation. The platform seeks to connect representatives of the public sector, civil society, academia, the private sector, the media, and youth organizations to foster knowledge exchange, the identification of shared priorities, and the formulation of collaborative solutions.","buenaPractica":"As the governance mechanism for this initiative, a Strategic Council was established, composed of leaders from diverse sectors and backgrounds, ensuring plurality of perspectives, representativeness, and the legitimacy of decision-making processes. This model strengthens collaborative governance by promoting the participation of multiple actors in defining common agendas, while contributing to an anticipatory governance capable of identifying trends, risks, and opportunities for the future of democracy in Brazil","actores":"UNDP","nivelDetalle":"National","anioTexto":"2025-2026","paisDetalle":"Brazil","institucion":"UNDP Brazil","comentarios":"Conceived as a permanent space for dialogue, exchange, and collective construction, the platform seeks to build consensus around complex challenges affecting contemporary democracies, promoting collaboration among public institutions, academia, civil society, the private sector, the media, and youth organizations."}},{"id":116,"dimensionId":"colaborativa","pais":"BR","nivel":"Nacional","anio":2027,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"cnj.jus.br","en":"cnj.jus.br"},"url":"https://www.cnj.jus.br/sistema-carcerario/fazendo-justica/"},{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/pt/brazil"},{"label":{"es":"portal.stf.jus.br","en":"portal.stf.jus.br"},"url":"https://portal.stf.jus.br/processos/detalhe.asp?incidente=4783560"}],"es":{"titulo":"Pena Justa – Fazendo Justiça","resumen":"La iniciativa Pena Justa se enmarca en los esfuerzos del Estado brasileño para enfrentar las violaciones estructurales de derechos en el sistema penitenciario, reconocidas por el Supremo Tribunal Federal en la ADPF 347, que declaró un “estado de cosas inconstitucional”. El proyecto busca fortalecer el acceso a la justicia y promover decisiones más equitativas en materia penal, mediante articulación interinstitucional, generación de evidencia y desarrollo de herramientas que reduzcan desigualdades y promuevan un enfoque centrado en derechos.","buenaPractica":"Uso de evidencia y datos para orientar decisiones judiciales más equitativas Articulación interinstitucional entre justicia, cooperación internacional y actores sociales Enfoque en interseccionalidad (género, raza, vulnerabilidad) Desarrollo de metodologías replicables para otros contextos del sistema de justicia","actores":"Programa de las Naciones Unidas para el Desarrollo (PNUD) Consejo Nacional de Justicia (CNJ) Supremo Tribunal Federal (referente a la ADPF 347) Actores del sistema de justicia y sociedad civil","nivelDetalle":"Nacional","anioTexto":"2023- 2027","paisDetalle":"Brasil","institucion":"Conselho Nacional de Justiça (CNJ)","comentarios":"La experiencia operacionaliza, en el ámbito de políticas públicas, las determinaciones estructurales derivadas de la ADPF 347, contribuyendo al fortalecimiento del Estado de Derecho y al cumplimiento de los ODS 16. Presenta potencial de replicabilidad en otros contextos de reforma de sistemas penales en América Latina."},"en":{"titulo":"Pena Justa – Fazendo Justiça","resumen":"The Pena Justa initiative is part of the Brazilian State's efforts to address structural rights violations in the prison system, recognized by the Supreme Federal Court in ADPF 347, which declared an \"unconstitutional state of affairs.\" The project seeks to strengthen access to justice and promote more equitable decisions in criminal matters through inter-institutional coordination, evidence generation, and the development of tools that reduce inequalities and promote a rights-centered approach.","buenaPractica":"Use of evidence and data to guide more equitable judicial decisions. Inter-institutional coordination among the justice system, international cooperation, and social actors. Focus on intersectionality (gender, race, vulnerability). Development of replicable methodologies for other contexts within the justice system","actores":"United Nations Development Programme (UNDP), National Council of Justice (CNJ), Supreme Federal Court (with regard to ADPF 347), justice system actors, and civil society","nivelDetalle":"National","anioTexto":"2023- 2027","paisDetalle":"Brazil","institucion":"Conselho Nacional de Justiça (CNJ)","comentarios":"The experience operationalizes, in the public policy sphere, the structural determinations derived from ADPF 347, contributing to the strengthening of the rule of law and the achievement of SDG 16. It has potential for replicability in other contexts of criminal justice system reform in Latin America."}},{"id":117,"dimensionId":"colaborativa","pais":"BR","nivel":"Nacional","anio":2026,"vinculadaPNUD":true,"destacada":false,"fuentes":[],"es":{"titulo":"Plan Nacional de Acción sobre Empresas y Derechos Humanos","resumen":"Construcción participativa del primer Plan Nacional de Acción sobre Empresas y Derechos Humanos, alineado con los Principios Rectores de la ONU.","buenaPractica":"Articulación entre sector público, sector privado, sociedad civil y academia.","actores":"Ministerio de Trabajo, Ministerio de Derechos Humanos, PNUD","nivelDetalle":"Nacional","anioTexto":"2024-2026","paisDetalle":"Brasil","institucion":"Gobierno Federal de Brasil","comentarios":"Experiencia emblemática para integrar sostenibilidad empresarial, debida diligencia y derechos humanos."},"en":{"titulo":"National Action Plan on Business and Human Rights","resumen":"Participatory construction of the first National Action Plan on Business and Human Rights, aligned with the UN Guiding Principles.","buenaPractica":"Coordination among the public sector, private sector, civil society, and academia.","actores":"Ministry of Labor, Ministry of Human Rights, UNDP","nivelDetalle":"National","anioTexto":"2024-2026","paisDetalle":"Brazil","institucion":"Federal Government of Brazil","comentarios":"Emblematic experience for integrating corporate sustainability, due diligence, and human rights."}},{"id":118,"dimensionId":"colaborativa","pais":"CL","nivel":"Nacional","anio":2024,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/chile/noticias/mesa-de-gobernanza-firma-compromiso-con-el-objetivo-de-garantizar-informacion-integra-en-elecciones-2025"},{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/chile/mesa-de-gobernanza-para-la-integridad-de-la-informacion-de-los-procesos-electorales-en-chile"}],"es":{"titulo":"National Action Coalition on Information Integrity and Elections","resumen":"Mesa de Gobernanza para la Integridad de la Información en Procesos Electorales, creada y liderada por SERVEL y PNUD Chile, con el objetivo de promover un ecosistema de informativo íntegro de cara a las elecciones de en el país.","buenaPractica":"Constituye un espacio de trabajo colaborativo y en alianza entre actores públicos y privados para enfrentar la contaminación informativa y la comunicación tóxica en contextos electorales. Entre sus principales hitos destaca la firma de un compromiso ético con la integridad de la información electoral en septiembre de 2025, y el lanzamiento de la campaña \"Infórmate con Responsabilidad, Participa con Integridad\".","actores":"La Mesa es liderada por PNUD y SERVEL, e integra a representante de plataformas digitales, medios tradicionales de comunicación, organizaciones de la sociedad civil y academia.","nivelDetalle":"Nacional","anioTexto":"2024 a la fecha","paisDetalle":"Chile","institucion":"Servicio Electoral de Chile (SERVEL) (Chile)","comentarios":"PNUD paralelamente implementó la herramienta eMonitor+ para el monitoreo de redes sociales en torno a la contaminación informativa y entregó insumos para la acción de la Mesa. Plataformas como Meta, TikTok, Google y X implementaron productos cívicos específicos para el proceso electoral, mientras que organizaciones como Malaespina y Fundación Ciudadanía Inteligente desarrollaron herramientas de verificación y orientación ciudadana, consolidando a la Mesa como un modelo pionero de colaboración multisectorial para la integridad informativa en contextos electorales"},"en":{"titulo":"National Action Coalition on Information Integrity and Elections","resumen":"Governance Roundtable for Information Integrity in Electoral Processes, created and led by SERVEL and UNDP Chile, with the aim of promoting an information ecosystem with integrity in the lead-up to the country's elections.","buenaPractica":"It constitutes a collaborative working space and partnership between public and private actors to confront information pollution and toxic communication in electoral contexts. Its main milestones include the signing of an ethical commitment to electoral information integrity in September 2025, and the launch of the campaign \"Infórmate con Responsabilidad, Participa con Integridad\" (Get Informed Responsibly, Participate with Integrity).","actores":"The Roundtable is led by UNDP and SERVEL, and brings together representatives of digital platforms, traditional media, civil society organizations, and academia.","nivelDetalle":"National","anioTexto":"2024 to date","paisDetalle":"Chile","institucion":"Servicio Electoral de Chile (SERVEL) (Chile)","comentarios":"In parallel, UNDP implemented the eMonitor+ tool for monitoring social media around information pollution and provided inputs for the Roundtable's action. Platforms such as Meta, TikTok, Google, and X implemented specific civic products for the electoral process, while organizations such as Malaespina and Fundación Ciudadanía Inteligente developed verification and citizen guidance tools, consolidating the Roundtable as a pioneering model of multisectoral collaboration for information integrity in electoral contexts"}},{"id":119,"dimensionId":"colaborativa","pais":"CL","nivel":"Subnacional","anio":2022,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"consejoparalainfancialosrios.cl","en":"consejoparalainfancialosrios.cl"},"url":"https://consejoparalainfancialosrios.cl/"},{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/chile/noticias/pnud-y-gobierno-regional-de-los-rios-impulsan-la-participacion-infantil-y-el-desarrollo-territorial-sostenible-en-innovador-encuentro"}],"es":{"titulo":"Fortalecimiento de la gobernanza y participación de la niñez y la adolescencia en el territorio","resumen":"Constitución de un Consejo Consultivo Regional para la Infancia y la Adolescencia y de la Red de Liderazgo y Unión de Niñez y Adolescencia (Red LUNA), integrada por niños/as y adolescentes.","buenaPractica":"El Consejo Consultivo para la Infancia y Adolescencia y la Red LUNA operaron como mecanismos permanentes y complementarios —adultos y NNA— que, con apoyo técnico del PNUD y el GORE y la articulación de diversas instituciones regionales vinculadas a la infancia y adolescencia, co-construyeron de manera participativa el Plan de Acción Regional para la Infancia y Adolescencia, integrando enfoques territorial, intercultural y de derechos.","actores":"PNUD, Gobierno Regional de Los Ríos, diversos actores regionales relevantes en materia de infancia y adolescencia; representante de NNA","nivelDetalle":"Regional","anioTexto":"2022 a la fecha","paisDetalle":"Chile","institucion":"Gobierno Regional de Los Ríos (Chile)","comentarios":"Modelo pionero de gobernanza regional en materia de infancia y adolescencia en Chile."},"en":{"titulo":"Strengthening governance and the participation of children and adolescents in the territory","resumen":"Establishment of a Regional Advisory Council for Children and Adolescents and of the Leadership and Union Network for Children and Adolescents (Red LUNA), composed of children and adolescents.","buenaPractica":"The Advisory Council for Children and Adolescents and Red LUNA operated as permanent and complementary mechanisms —adults and children/adolescents— which, with technical support from UNDP and the Regional Government (GORE) and the coordination of various regional institutions linked to childhood and adolescence, participatorily co-constructed the Regional Action Plan for Children and Adolescents, integrating territorial, intercultural, and rights-based approaches.","actores":"UNDP, Regional Government of Los Ríos, various relevant regional actors in matters of childhood and adolescence; representative of children and adolescents","nivelDetalle":"Regional","anioTexto":"2022 to date","paisDetalle":"Chile","institucion":"Regional Government of Los Ríos (Chile)","comentarios":"Pioneering model of regional governance on childhood and adolescence in Chile."}},{"id":120,"dimensionId":"colaborativa","pais":"CL","nivel":"Subnacional","anio":2024,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"gorev.cl","en":"gorev.cl"},"url":"http://www.gorev.cl/detalleNoticia.php?idNot=NDg2"},{"label":{"es":"radioallen.cl","en":"radioallen.cl"},"url":"https://radioallen.cl/valparaiso-gore-y-pnud-avanzan-para-la-actualizacion-de-planes-de-reduccion-de-riesgos-de-desastres-en-18-comunas-de-la-region/"}],"es":{"titulo":"Gobernanza y planificación para la reducción del riesgo de desastres en la región de Valparaíso","resumen":"Piloto de trabajo colaborativo entre el nivel regional, municipal y sectorial para fortalecer la planificación y la coordinación frente a desastres.","buenaPractica":"Se generó un mecanismo de colaboración, donde el PNUD actúa como puente metodológico para integrar los estándares oficiales de SENAPRED, el conocimiento territorial de los municipios y los marcos de planificación del Gobierno regional para producir Planes comunales sólidos técnicamente, pertinentes territorialmente","actores":"PNUD (acompañamiento), Gobierno Regional de Valparaíso, Servicio Nacional de Prevención y Respuesta ante Desastres (SENAPRED), Asociación de Municipalidades de la Región de Valparaíso","nivelDetalle":"Regional/municipal","anioTexto":"2024 a la fecha","paisDetalle":"Chile","institucion":"Gobierno Regional de Valparaíso (Chile)","comentarios":"El éxito del piloto ha permitido avanzar en nuevo proyecto para apoyar a más municipíos y avanzar en las bases de una Gobernanza regionla para la RRD con involucramiento de las comunidades"},"en":{"titulo":"Governance and planning for disaster risk reduction in the Valparaíso region","resumen":"Pilot of collaborative work among the regional, municipal, and sectoral levels to strengthen planning and coordination in the face of disasters.","buenaPractica":"A collaboration mechanism was created in which UNDP acts as a methodological bridge to integrate SENAPRED's official standards, the territorial knowledge of the municipalities, and the regional government's planning frameworks to produce communal plans that are technically sound and territorially relevant.","actores":"UNDP (support), Regional Government of Valparaíso, National Disaster Prevention and Response Service (SENAPRED), Association of Municipalities of the Valparaíso Region","nivelDetalle":"Regional/municipal","anioTexto":"2024 to date","paisDetalle":"Chile","institucion":"Regional Government of Valparaíso (Chile)","comentarios":"The success of the pilot has made it possible to move forward with a new project to support more municipalities and lay the foundations for a regional governance framework for DRR with community involvement."}},{"id":121,"dimensionId":"colaborativa","pais":"CO","nivel":"Nacional","anio":2026,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/colombia/noticias/cartagena-inicia-ruta-conversaciones-tierra-justicia"}],"es":{"titulo":"Implementación de la Jurisdicción Agraria y Rural","resumen":"Apoyo a la puesta en marcha de la nueva jurisdicción agraria creada para resolver conflictos relacionados con acceso y uso de la tierra.","buenaPractica":"Enfoque de acceso a la justicia territorial y fortalecimiento de capacidades judiciales rurales.","actores":"PNUD, FAO, Ministerio de Justicia y del Derecho, en los municipios PDET de San Juan Nepomuceno, Zambrano y El Carmen de Bolívar.","nivelDetalle":"Nacional","anioTexto":"2024-2026","paisDetalle":"Colombia","institucion":"Consejo Superior de la Judicatura","comentarios":"Experiencia estratégica para la implementación del Acuerdo de Paz y reducción de desigualdades territoriales."},"en":{"titulo":"Implementation of the Agrarian and Rural Jurisdiction","resumen":"Support for the launch of the new agrarian jurisdiction created to resolve conflicts related to land access and use.","buenaPractica":"Territorial access-to-justice approach and strengthening of rural judicial capacities.","actores":"UNDP, FAO, Ministry of Justice and Law, in the PDET municipalities of San Juan Nepomuceno, Zambrano, and El Carmen de Bolívar.","nivelDetalle":"National","anioTexto":"2024-2026","paisDetalle":"Colombia","institucion":"Superior Council of the Judiciary","comentarios":"A strategic experience for the implementation of the Peace Agreement and the reduction of territorial inequalities."}},{"id":122,"dimensionId":"colaborativa","pais":"EC","nivel":"Nacional","anio":2030,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"defensa.gob.ec","en":"defensa.gob.ec"},"url":"https://www.defensa.gob.ec/wp-content/uploads/downloads/2019/07/plan-matriz-web.pdf"}],"es":{"titulo":"Plan Nacional de Seguridad Integral","resumen":"Instrumento pionero que incorpora el enfoque de seguridad humana e integral, articulando seguridad ciudadana, gobernabilidad democrática, derechos humanos, prevención y gestión de riesgos.","buenaPractica":"Superación de enfoques exclusivamente policiales mediante una visión integral centrada en las personas.","actores":"Min Coordinadora de la Seguridad, PNUD, Min de RREE y movilidad humana, Min del Interior, Min de Defensa Nacional, Servicio Nacional de Gestion de Riesgos y emergencias; Centro de Inteligencia Estratégica","nivelDetalle":"Nacional","anioTexto":"2019-2030","paisDetalle":"Ecuador","institucion":"Ministerio Coordinador de Seguridad"},"en":{"titulo":"National Comprehensive Security Plan","resumen":"Pioneering instrument that incorporates a human and comprehensive security approach, articulating citizen security, democratic governance, human rights, prevention, and risk management.","buenaPractica":"Moving beyond exclusively police-centered approaches through a comprehensive, people-centered vision.","actores":"Coordinating Ministry of Security, UNDP, Ministry of Foreign Affairs and Human Mobility, Ministry of the Interior, Ministry of National Defense, National Risk and Emergency Management Service; Strategic Intelligence Center","nivelDetalle":"National","anioTexto":"2019-2030","paisDetalle":"Ecuador","institucion":"Coordinating Ministry of Security"}},{"id":123,"dimensionId":"colaborativa","pais":"PE","nivel":"Nacional","anio":2026,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"puntoedu.pucp.edu.pe","en":"puntoedu.pucp.edu.pe"},"url":"https://puntoedu.pucp.edu.pe/vida-universitaria/institucional/tejiendo-ciudadania-un-dialogo-colectivo-para-el-peru-democratico-elecciones-2026/"},{"label":{"es":"tejiendociudadania.pe","en":"tejiendociudadania.pe"},"url":"https://tejiendociudadania.pe/"},{"label":{"es":"facebook.com","en":"facebook.com"},"url":"https://www.facebook.com/PNUDPe/videos/tejiendo-ciudadan%C3%ADa/4427788620835035/"}],"es":{"titulo":"\"Tejiendo Ciudadanía: Encuentros por el Perú\"","resumen":"La iniciativa Tejiendo ciudadanía organizó 4 encuentros macrorregionales para abordar de manera participativa y descentralizada los retos de gobernabilidad y desarrollo sostenible en el país, donde participaron 310 organizaciones de la sociedad civil, el sector público y privado, la academia y los medios de comunicación.","buenaPractica":"Construcción de una red de aliados que permitió difundir e incluir a actores subrrepresentados en el debate público como las universidades y los medios de comunicación, de maner descentralizada. Como resultado, se desarrolló una Agenda Ciudadana con propuestas, que recoge preocupaciones transversales a todo el país y aquellas propias de cada macrorregión.","actores":"PNUD, Grupo La República, Instituto de Estudios Peruanos, Red Científica Peruana, 17 universidades en diversas regiones, y medios de comunicaciones regionales.","nivelDetalle":"Nacional y regiones","anioTexto":"2023 - 2026","paisDetalle":"Perú","institucion":"PNUD Perú, organizaciones de medios, think-tanks y universidades. Coordinación estrecha y entrega de la agenda ciudadana al Acuerdo Nacional (Presidencia del Consejo de Ministros)"},"en":{"titulo":"\"Tejiendo Ciudadanía: Encuentros por el Perú\" (Weaving Citizenship: Gatherings for Peru)","resumen":"The Tejiendo Ciudadanía initiative organized 4 macro-regional gatherings to address, in a participatory and decentralized manner, the country's governance and sustainable development challenges, with the participation of 310 organizations from civil society, the public and private sectors, academia, and the media.","buenaPractica":"Building a network of allies that made it possible to reach and include underrepresented actors in public debate, such as universities and the media, in a decentralized manner. As a result, a Citizen Agenda with proposals was developed, capturing concerns shared across the country as well as those specific to each macro-region.","actores":"UNDP, Grupo La República, Instituto de Estudios Peruanos, Red Científica Peruana, 17 universities in various regions, and regional media outlets.","nivelDetalle":"National and regions","anioTexto":"2023 - 2026","paisDetalle":"Peru","institucion":"UNDP Peru, media organizations, think tanks, and universities. Close coordination and delivery of the Citizen Agenda to the Acuerdo Nacional (Presidency of the Council of Ministers)"}},{"id":124,"dimensionId":"colaborativa","pais":"PE","nivel":"Nacional","anio":2026,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/peru/proyectos/proyecto-de-empresas-y-derechos-humanos-bhr-en-peru"}],"es":{"titulo":"Descentralización del Plan Nacional de Acción sobre Empresas y Derechos Humanos","resumen":"Adaptación e implementación territorial del Plan Nacional de Empresas y Derechos Humanos mediante gobiernos regionales y actores locales.","buenaPractica":"Territorialización de la agenda BHR y fortalecimiento de capacidades locales.","actores":"PNUD, Gobierno Nacional de Perú, Las empresas japonesas, sus proveedores y socios","nivelDetalle":"Nacional y subnacional","anioTexto":"2023-2026","paisDetalle":"Perú","institucion":"Ministerio de Justicia y Derechos Humanos","comentarios":"Considerada una de las experiencias más avanzadas de localización de la agenda de Empresas y Derechos Humanos."},"en":{"titulo":"Decentralization of the National Action Plan on Business and Human Rights","resumen":"Territorial adaptation and implementation of the National Plan on Business and Human Rights through regional governments and local actors.","buenaPractica":"Territorialization of the BHR agenda and strengthening of local capacities.","actores":"UNDP, National Government of Peru, Japanese companies, their suppliers and partners","nivelDetalle":"National and subnational","anioTexto":"2023-2026","paisDetalle":"Peru","institucion":"Ministry of Justice and Human Rights","comentarios":"Considered one of the most advanced experiences in localizing the Business and Human Rights agenda."}},{"id":125,"dimensionId":"colaborativa","pais":"PE","nivel":"Local","anio":2022,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/peru/publicaciones/estudio-tecnico-independiente-del-lote-8"},{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/peru/noticias/inicia-el-estudio-tecnico-independiente-eti-del-lote-8"}],"es":{"titulo":"Estudio Técnico Independiente (ETI) del Lote 8, una experiencia de diálogo y participación intercultural","resumen":"Elaboración participativa e intercultural del ETI del Lote 8, combinando diagnóstico técnico con gestión del diálogo, mediación y articulación entre Estado y federaciones indígenas para la remediación ambiental, en una zona de alta conflictividad y actividad petrolera en la Amazonía peruana.","buenaPractica":"Modelo de gobernanza participativo e intercultural basado en un Comité de Seguimiento tripartito (Estado-federaciones-PNUD) como espacio de diálogo, coordinación y toma de decisiones consensuadas, con transparencia, seguimiento de acuerdos y legitimidad.","actores":"PNUD, MINEM, 11 federaciones indígenas","nivelDetalle":"Local","anioTexto":"2020 - 2022","paisDetalle":"Perú","institucion":"Ministerio de Energía y Minas (MINEM)"},"en":{"titulo":"Independent Technical Study (ETI) of Block 8, an experience of intercultural dialogue and participation","resumen":"Participatory and intercultural development of the ETI for Block 8, combining technical assessment with dialogue management, mediation, and coordination between the State and Indigenous federations for environmental remediation, in an area of high conflict and oil activity in the Peruvian Amazon.","buenaPractica":"Participatory and intercultural governance model based on a tripartite Monitoring Committee (State-federations-UNDP) as a space for dialogue, coordination, and consensus-based decision-making, with transparency, follow-up on agreements, and legitimacy.","actores":"UNDP, MINEM, 11 Indigenous federations","nivelDetalle":"Local","anioTexto":"2020 - 2022","paisDetalle":"Peru","institucion":"Ministry of Energy and Mines (MINEM)"}},{"id":126,"dimensionId":"colaborativa","pais":"UY","nivel":"Nacional","anio":2026,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"gub.uy","en":"gub.uy"},"url":"https://www.gub.uy/plan-nacional-de-seguridad-publica/documentos"}],"es":{"titulo":"Plan Nacional de Seguridad Pública 2025-2035","resumen":"Proceso de construcción de una política pública integral de seguridad basada en evidencia, participación ciudadana y coordinación interinstitucional para abordar homicidios, violencia de género, armas de fuego, narcotráfico, ciberdelito y prevención de la violencia.","buenaPractica":"Incorporación de mecanismos de participación ciudadana y enfoque de gobierno abierto en la formulación de la política de seguridad.","actores":"Min. Interior, PNUD","nivelDetalle":"Nacional","anioTexto":"2025-2026","paisDetalle":"Uruguay","institucion":"Ministerio del Interior"},"en":{"titulo":"National Public Security Plan 2025-2035","resumen":"Process of building a comprehensive public security policy based on evidence, citizen participation, and inter-institutional coordination to address homicides, gender-based violence, firearms, drug trafficking, cybercrime, and violence prevention.","buenaPractica":"Incorporation of citizen participation mechanisms and an open government approach in the formulation of the security policy.","actores":"Ministry of the Interior, UNDP","nivelDetalle":"National","anioTexto":"2025-2026","paisDetalle":"Uruguay","institucion":"Ministry of the Interior"}},{"id":127,"dimensionId":"comunicacional","pais":"BR","nivel":"Nacional","anio":2025,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/pt/brazil/publications/programa-de-enfrentamento-violencia-politica-de-genero-nas-eleicoes-de-2024"}],"es":{"titulo":"Programa Nacional de Enfrentamiento a la Violencia Política de Género en las Elecciones de 2024","resumen":"La iniciativa, desarrollada por la Defensoría Pública de la Unión (DPU) en colaboración con el PNUD, tiene como objetivo prevenir, visibilizar y enfrentar la violencia política de género durante el proceso electoral de 2024 en Brasil. El programa articula estrategias de comunicación, canales de denuncia y asistencia jurídica gratuita, contribuyendo a garantizar el ejercicio de los derechos políticos de las mujeres y a fortalecer la democracia. La iniciativa incorpora la producción de información, campañas de sensibilización y mecanismos de atención a víctimas, promoviendo un ecosistema comunicacional más seguro e inclusivo.","buenaPractica":"Creación de canales accesibles y seguros para denuncia y atención a víctimas Uso estratégico de comunicación pública para visibilizar la violencia política de género Generación y sistematización de datos sobre casos y perfiles de violencia Articulación interinstitucional (justicia, sistema electoral y organismos internacionales) Integración de asistencia jurídica con estrategias de comunicación y educación en derechos [direitoshu...dpu.def.br]","actores":"Defensoría Pública de la Unión (DPU) Programa de las Naciones Unidas para el Desarrollo (PNUD) Justicia Electoral (TSE y TREs) Ministerio de las Mujeres y otras instituciones públicas Sociedad civil y redes de apoyo a mujeres en la política","nivelDetalle":"Nacional","anioTexto":"2024-2025","paisDetalle":"Brasil","institucion":"Defensoría Pública de la Unión (DPU)","comentarios":"La experiencia fortalece la gobernanza comunicacional al integrar información, atención jurídica y sensibilización social para enfrentar la violencia política de género, reconocida en Brasil como un delito que busca restringir la participación política de las mujeres. Asimismo, contribuye a los ODS 5 (igualdad de género), 10 (reducción de desigualdades) y 16 (instituciones sólidas), con alto potencial de replicabilidad en América Latina."},"en":{"titulo":"National Program to Confront Political Gender-Based Violence in the 2024 Elections","resumen":"The initiative, developed by the Federal Public Defender's Office (DPU) in collaboration with UNDP, aims to prevent, raise the visibility of, and confront political gender-based violence during the 2024 electoral process in Brazil. The program articulates communication strategies, reporting channels, and free legal assistance, helping to guarantee the exercise of women's political rights and to strengthen democracy. The initiative incorporates the production of information, awareness-raising campaigns, and victim support mechanisms, promoting a safer and more inclusive communication ecosystem.","buenaPractica":"Creation of accessible and safe channels for reporting and assisting victims. Strategic use of public communication to raise the visibility of political gender-based violence. Generation and systematization of data on cases and profiles of violence. Inter-institutional coordination (justice system, electoral system, and international organizations). Integration of legal assistance with communication strategies and rights education [direitoshu...dpu.def.br]","actores":"Federal Public Defender's Office (DPU), United Nations Development Programme (UNDP), Electoral Justice (TSE and TREs), Ministry of Women and other public institutions, civil society and support networks for women in politics","nivelDetalle":"National","anioTexto":"2024-2025","paisDetalle":"Brazil","institucion":"Federal Public Defender's Office (DPU)","comentarios":"The experience strengthens communication governance by integrating information, legal assistance, and social awareness-raising to confront political gender-based violence, recognized in Brazil as a crime aimed at restricting women's political participation. It also contributes to SDGs 5 (gender equality), 10 (reduced inequalities), and 16 (strong institutions), with high potential for replication in Latin America."}},{"id":128,"dimensionId":"comunicacional","pais":"CL","nivel":"Nacional","anio":2025,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/chile/ParticipaConIntegridadPNUD"},{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/chile/noticias/pnud-chile-lanza-campana-por-la-integridad-de-la-informacion-electoral"}],"es":{"titulo":"Campaña “Infórmate con Responsabilidad, Participa con Integridad.”","resumen":"Campaña comunicacional que tuvo como propósito fortalecer la confianza ciudadana y la calidad del debate público, fomentando una participación informada y el ejercicio responsable del derecho a voto.","buenaPractica":"La campaña invitó a la ciudadanía a informarse con responsabilidad y participar con integridad en el proceso electoral 2025, promoviendo un entorno comunicacional plural, transparente y respetuoso.","actores":"PNUD","nivelDetalle":"Nacional","anioTexto":"2025","paisDetalle":"Chile","institucion":"PNUD (Chile)"},"en":{"titulo":"\"Infórmate con Responsabilidad, Participa con Integridad\" Campaign (Get Informed Responsibly, Participate with Integrity)","resumen":"Communication campaign aimed at strengthening citizen trust and the quality of public debate, fostering informed participation and the responsible exercise of the right to vote.","buenaPractica":"The campaign invited citizens to get informed responsibly and participate with integrity in the 2025 electoral process, promoting a plural, transparent, and respectful communication environment.","actores":"UNDP","nivelDetalle":"National","anioTexto":"2025","paisDetalle":"Chile","institucion":"UNDP (Chile)"}},{"id":129,"dimensionId":"comunicacional","pais":"PE","nivel":"Nacional","anio":2020,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/peru/publicaciones/ama-llulla-primera-red-de-medios-para-la-verificacion-de-informacion-en-el-peru"},{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/peru/noticias/ama-llulla-una-cruzada-de-medios-contra-la-mentira-en-la-campana-electoral-del-2021"},{"label":{"es":"ojo-publico.com","en":"ojo-publico.com"},"url":"https://ojo-publico.com/autor/red.amallulla"},{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/latin-america/historias/palabras-que-unen-el-periodismo-como-puente-para-la-paz-en-peru-y-bolivia"}],"es":{"titulo":"Ama Llulla","resumen":"Creación de la red Ama Llulla para fortalecer el acceso a información verificada y la confianza ciudadana frente a la desinformación en contextos electorales.","buenaPractica":"Primera red y plataforma colaborativa de medios contra la desinformación en el Perú, articulando a más de 20 medios locales y digitales para la verificación de información mediante herramientas tecnológicas e inteligencia artificial (IA), incluyendo la traducción en lenguas originarias.","actores":"PNUD, Ojo Público, medios locales","nivelDetalle":"Nacional y local","anioTexto":"Desde 2020","paisDetalle":"Perú","institucion":"Ojo Público y medios locales"},"en":{"titulo":"Ama Llulla","resumen":"Creation of the Ama Llulla network to strengthen access to verified information and citizen trust in the face of disinformation in electoral contexts.","buenaPractica":"The first collaborative media network and platform against disinformation in Peru, bringing together more than 20 local and digital media outlets for fact-checking using technological tools and artificial intelligence (AI), including translation into Indigenous languages.","actores":"UNDP, Ojo Público, local media","nivelDetalle":"National and local","anioTexto":"Since 2020","paisDetalle":"Peru","institucion":"Ojo Público and local media"}},{"id":130,"dimensionId":"comunicacional","pais":"PE","nivel":"Nacional","anio":2017,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"gob.pe","en":"gob.pe"},"url":"https://www.gob.pe/comunicacionsocial"},{"label":{"es":"gob.pe","en":"gob.pe"},"url":"https://www.gob.pe/institucion/regionlambayeque/noticias/1383892-comunicadores-del-gobierno-regional-de-lambayeque-fortalecen-capacidades-en-taller-macrorregional-organizado-por-la-pcm"}],"es":{"titulo":"Proyecto Acercando el Estado al ciudadano","resumen":"Contribuye a mejorar el acceso de la ciudadanía a la información pública gubernamental mediante el fortalecimiento de la comunicación pública estratégica y la gestión comunicacional del Estado.","buenaPractica":"Formación de capacidades de equipos de comunicación de manera descentralizada, generación de evidencia para la toma de decisiones y articulación entre sectores. Preparación comunicacional frente a situaciones de crisis y emergencias.","actores":"PNUD, Secretaría de Comunicación Social (PCM), equipos comunicacionales de gobiernos subnacionales y de sectores","nivelDetalle":"Nacional y regiones","anioTexto":"Desde 2017","paisDetalle":"Perú","institucion":"Presidencia del Consejo de Ministros (PCM)"},"en":{"titulo":"Bringing the State Closer to Citizens Project","resumen":"Contributes to improving citizens' access to public government information by strengthening strategic public communication and the State's communication management.","buenaPractica":"Decentralized capacity building for communication teams, generation of evidence for decision-making, and coordination across sectors. Communication preparedness for crisis and emergency situations.","actores":"UNDP, Secretariat of Social Communication (PCM), communication teams of subnational governments and sectors","nivelDetalle":"National and regions","anioTexto":"Since 2017","paisDetalle":"Peru","institucion":"Presidency of the Council of Ministers (PCM)"}},{"id":131,"dimensionId":"comunicacional","pais":"PE","nivel":"Nacional","anio":2023,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/peru/noticias/emonitor-promoviendo-alianzas-para-poner-la-tecnologia-al-servicio-de-la-democracia"},{"label":{"es":"api.transparencia.org.pe","en":"api.transparencia.org.pe"},"url":"https://api.transparencia.org.pe/app-publicaciones/dc-La%20institucionalidad%20electoral%20bajo%20ataque_Informe_eMonitor+.pdf"}],"es":{"titulo":"eMonitor+","resumen":"Implementación de una herramienta basada en IA para caracterizar la presencia y dinámica de la polución informativa electoral en el ecosistema digital peruano, así como analizar la incidencia de comunicación tóxica, discursos de odio y violencia basada en género en comunicaciones digitales vinculadas a procesos electorales.","buenaPractica":"Combina innovación tecnológica con participación ciudadana y generación de conocimiento. Se ha involucrado a universidades, particularmente a docentes y estudiantes, para el uso de la herramienta en procesos de monitoreo y análisis de información digital. Busca facilitar mecanismos de alerta temprana y aportar información útil para la prevención de riesgos que puedan afectar la integridad de los procesos electorales.","actores":"PNUD, universidades, organismos electorales","nivelDetalle":"Nacional","anioTexto":"Desde 2023","paisDetalle":"Perú","institucion":"PNUD Perú"},"en":{"titulo":"eMonitor+","resumen":"Implementation of an AI-based tool to characterize the presence and dynamics of electoral information pollution in the Peruvian digital ecosystem, as well as to analyze the incidence of toxic communication, hate speech, and gender-based violence in digital communications linked to electoral processes.","buenaPractica":"Combines technological innovation with citizen participation and knowledge generation. Universities have been involved, particularly faculty and students, in using the tool for digital information monitoring and analysis. It seeks to facilitate early warning mechanisms and provide useful information for preventing risks that may affect the integrity of electoral processes.","actores":"UNDP, universities, electoral bodies","nivelDetalle":"National","anioTexto":"Since 2023","paisDetalle":"Peru","institucion":"UNDP Peru"}},{"id":132,"dimensionId":"integra","pais":"CL","nivel":"Nacional","anio":2012,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"alianzaanticorrupcion.cl","en":"alianzaanticorrupcion.cl"},"url":"https://www.alianzaanticorrupcion.cl/AnticorrupcionUNCAC/"}],"es":{"titulo":"Alianza Anticorrupción UNCAC Chile","resumen":"Mesa de trabajo integrada por instituciones públicas, privadas, de la sociedad civil y la academia para promover la integridad y anticorrupción en Chile, con miras a la implementación de la Convención de las Naciones Unidas Contra la Corrupción en el país.","buenaPractica":"La Alianz liderada por el PNUD y la contraloría General de la República, ha permitido la articulación de los distintos sectores y entidades en torno a la integridad, que de otra forma no se contempla en el diseño institucional; aprovecha sinergias y evita división y duplicidades en actividades de promoción, capacitación y difusión, así como en relevar buenas prácticas y hacer seguimiento legislativo. En el contexto de la Alianza, se articula el apoyo a municipalidades de todo el país para la elaboración y adopción de códigos de ética.","actores":"La Alianza fue fundada por PNUD y la Contraloría General de la República, y llevan la Coordinación Ejecutiva de la Alianza. Está integrada por 45 entidades comprendiendo las principales instituciones públicas concernidas con la integridad y anticorrupción; asociaciones gremiales; universidades y organizaciones de la sociedad civil.","nivelDetalle":"Nacional","anioTexto":"Desde 2012 a la fecha","paisDetalle":"Chile","institucion":"Alianza Anticorrupción UNCAC Chile (Interinstitucional) (Chile)"},"en":{"titulo":"UNCAC Anti-Corruption Alliance Chile","resumen":"Working group composed of public, private, civil society, and academic institutions to promote integrity and anti-corruption in Chile, with a view to implementing the United Nations Convention against Corruption in the country.","buenaPractica":"The Alliance, led by UNDP and the Office of the Comptroller General of the Republic, has enabled the coordination of different sectors and entities around integrity, something not otherwise contemplated in the institutional design; it leverages synergies and avoids fragmentation and duplication in promotion, training, and dissemination activities, as well as in highlighting good practices and conducting legislative monitoring. Within the framework of the Alliance, support is coordinated for municipalities across the country in developing and adopting codes of ethics.","actores":"The Alliance was founded by UNDP and the Office of the Comptroller General of the Republic, which hold its Executive Coordination. It comprises 45 entities, including the main public institutions concerned with integrity and anti-corruption, trade associations, universities, and civil society organizations.","nivelDetalle":"National","anioTexto":"Since 2012 to date","paisDetalle":"Chile","institucion":"UNCAC Anti-Corruption Alliance Chile (Inter-institutional) (Chile)"}},{"id":133,"dimensionId":"integra","pais":"PE","nivel":"Nacional","anio":2021,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"proetica.org.pe","en":"proetica.org.pe"},"url":"https://www.proetica.org.pe/laboratorio-de-innovacion-anticorrupcion/"}],"es":{"titulo":"Laboratorio de Innovación Anticorrupción","resumen":"Creación de un laboratorio de innovación para promover evidencia frente a desafíos de corrupción e integridad pública.","buenaPractica":"Plataforma abierta de experimentación, co-creación, diálogo y difusión, que bus
