ca articular a Estado, sociedad civil, academia, sector privado y cooperación internacional para generar evidencia, investigación aplicada y soluciones innovadoras en materia de transparencia e integridad, con enfoque en el mejoramiento de políticas y servicios públicos.","actores":"PNUD, Proética (Capítulo Peruano de Transparency International), actores regionales/locales","nivelDetalle":"Nacional","anioTexto":"Desde 2021","paisDetalle":"Perú","institucion":"PNUD Perú, Proética (Capítulo Peruano de Transparencia Internacional)"},"en":{"titulo":"Anti-Corruption Innovation Laboratory","resumen":"Creation of an innovation laboratory to promote evidence in the face of corruption and public integrity challenges.","buenaPractica":"An open platform for experimentation, co-creation, dialogue, and dissemination that seeks to bring together the State, civil society, academia, the private sector, and international cooperation to generate evidence, applied research, and innovative solutions on transparency and integrity, with a focus on improving public policies and services.","actores":"UNDP, Proética (Peruvian Chapter of Transparency International), regional/local actors","nivelDetalle":"National","anioTexto":"Since 2021","paisDetalle":"Peru","institucion":"UNDP Peru, Proética (Peruvian Chapter of Transparency International)"}},{"id":134,"dimensionId":"integra","pais":"DO","nivel":"Nacional","anio":2026,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"poderjudicial.gob.do","en":"poderjudicial.gob.do"},"url":"https://poderjudicial.gob.do/republica-dominicana-logra-el-mayor-avance-mundial-en-el-indice-de-estado-de-derecho-2025-del-world-justice-project/"}],"es":{"titulo":"Métrica Judicial y Sistema de Indicadores","resumen":"Desarrollo de indicadores de desempeño judicial, accesibilidad y justicia abierta para monitorear resultados institucionales.","buenaPractica":"Uso de evidencia para la toma de decisiones y mejora continua de servicios judiciales.","actores":"PNUD, WJP, Poder Judicial Dominicano","nivelDetalle":"Nacional","anioTexto":"2024-2026","paisDetalle":"Rep. Dominicana","institucion":"Poder Judicial de República Dominicana","comentarios":"Vinculado a iniciativas de Justicia Abierta y Justice Action Coalition."},"en":{"titulo":"Judicial Metrics and Indicator System","resumen":"Development of indicators on judicial performance, accessibility, and open justice to monitor institutional results.","buenaPractica":"Use of evidence for decision-making and continuous improvement of judicial services.","actores":"UNDP, WJP, Dominican Judiciary","nivelDetalle":"National","anioTexto":"2024-2026","paisDetalle":"Dominican Rep.","institucion":"Judiciary of the Dominican Republic","comentarios":"Linked to Open Justice initiatives and the Justice Action Coalition."}},{"id":135,"dimensionId":"digital","pais":"BR","nivel":"Nacional","anio":2023,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"gov.br","en":"gov.br"},"url":"https://www.gov.br/mdh/pt-br/assuntos/noticias/2025/setembro/mdhc-apresenta-diagnostico-inedito-sobre-violencia-sexual-online-contra-publico-infantojuvenil-no-brasil"}],"es":{"titulo":"Diagnóstico Nacional sobre la Violencia Sexual en Línea contra Niñas, Niños y Adolescentes y aportes para el ECA Digital","resumen":"Iniciativa de investigación aplicada destinada a identificar y analizar riesgos, actores, servicios, marcos regulatorios y buenas prácticas relacionadas con la violencia sexual en línea contra niñas, niños y adolescentes. El trabajo produjo evidencia y recomendaciones orientadas al fortalecimiento de las políticas públicas de protección de derechos en los entornos digitales.","buenaPractica":"La experiencia constituye un ejemplo de gobernanza digital basada en evidencia, articulando a la academia, el gobierno, el sistema de garantía de derechos, el sector privado y la sociedad civil para apoyar la formulación de políticas públicas y marcos regulatorios destinados a la protección integral de niñas, niños y adolescentes en el entorno digital","actores":"MDHC, PNUD, UFRN/OBIJUV, CONANDA, Sistema de Garantia de Direitos, empresas de tecnologia, organizações da sociedade civil e especialistas","nivelDetalle":"Nacional","anioTexto":"2023 - atual","paisDetalle":"Brasil","institucion":"Ministério dos Direitos Humanos e da Cidadania","comentarios":"La experiencia contribuyó a la generación de conocimiento y recomendaciones que sirvieron de base para los debates nacionales sobre la protección de niñas, niños y adolescentes en el entorno digital, así como para las iniciativas vinculadas al ECA Digital."},"en":{"titulo":"National Diagnostic on Online Sexual Violence against Children and Adolescents and contributions to the Digital ECA","resumen":"Applied research initiative aimed at identifying and analyzing risks, actors, services, regulatory frameworks, and good practices related to online sexual violence against children and adolescents. The work produced evidence and recommendations oriented toward strengthening public policies for the protection of rights in digital environments.","buenaPractica":"The experience is an example of evidence-based digital governance, bringing together academia, government, the rights guarantee system, the private sector, and civil society to support the formulation of public policies and regulatory frameworks aimed at the comprehensive protection of children and adolescents in the digital environment","actores":"MDHC, UNDP, UFRN/OBIJUV, CONANDA, Sistema de Garantia de Direitos, technology companies, civil society organizations, and specialists","nivelDetalle":"National","anioTexto":"2023 - ongoing","paisDetalle":"Brazil","institucion":"Ministério dos Direitos Humanos e da Cidadania","comentarios":"The experience contributed to generating knowledge and recommendations that served as a basis for national debates on the protection of children and adolescents in the digital environment, as well as for initiatives linked to the Digital ECA."}},{"id":136,"dimensionId":"digital","pais":"BR","nivel":"Nacional","anio":2019,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"cnj.jus.br","en":"cnj.jus.br"},"url":"https://www.cnj.jus.br/sistema-carcerario-seeus/"},{"label":{"es":"cnj.jus.br","en":"cnj.jus.br"},"url":"https://www.cnj.jus.br/sistema-carcerario/fazendo-justica/"}],"es":{"titulo":"SEEU – Sistema Electrónico de Ejecución Unificada","resumen":"El Sistema Electrónico de Ejecución Unificada (SEEU) es una plataforma digital que centraliza y automatiza la gestión de los procesos de ejecución penal en Brasil. Desarrollado por el Consejo Nacional de Justicia (CNJ), en el marco del Programa Fazendo Justiça, el sistema permite la integración nacional de datos penitenciarios y judiciales, contribuyendo al control más preciso del cumplimiento de penas y a la garantía de derechos de las personas privadas de libertad. El SEEU promueve mayor transparencia, eficiencia y seguridad jurídica en la ejecución penal.","buenaPractica":"Digitalización integral de los procesos de ejecución penal Integración nacional de información judicial y penitenciaria Reducción de errores en el cálculo de penas y tiempos de cumplimiento Mejora en la transparencia y acceso a la información Fortalecimiento de la toma de decisiones basada en datos en el sistema de justicia","actores":"Consejo Nacional de Justicia (CNJ) Programa Fazendo Justiça (CNJ/PNUD) Programa de las Naciones Unidas para el Desarrollo (PNUD) Tribunales de Justicia de los estados Sistema penitenciario brasileño","nivelDetalle":"Nacional","anioTexto":"2019 - em curso","paisDetalle":"Brasil","institucion":"Conselho Nacional de Justiça","comentarios":"El SEEU es considerado una de las principales herramientas de transformación digital del sistema de justicia brasileño, contribuyendo directamente a la superación de problemas estructurales identificados en la ejecución penal, incluyendo aquellos señalados en la ADPF 347. La experiencia tiene alto potencial de replicabilidad en otros países de la región como modelo de gobernanza digital aplicada a la justicia."},"en":{"titulo":"SEEU – Unified Electronic Enforcement System","resumen":"The Unified Electronic Enforcement System (SEEU) is a digital platform that centralizes and automates the management of criminal enforcement proceedings in Brazil. Developed by the National Council of Justice (CNJ) within the framework of the Fazendo Justiça Program, the system enables the national integration of prison and judicial data, contributing to more accurate oversight of sentence compliance and to guaranteeing the rights of persons deprived of liberty. The SEEU promotes greater transparency, efficiency, and legal certainty in criminal enforcement.","buenaPractica":"Comprehensive digitalization of criminal enforcement proceedings National integration of judicial and prison information Reduction of errors in the calculation of sentences and time served Improved transparency and access to information Strengthening of data-driven decision-making in the justice system","actores":"National Council of Justice (CNJ) Fazendo Justiça Program (CNJ/UNDP) United Nations Development Programme (UNDP) State Courts of Justice Brazilian prison system","nivelDetalle":"National","anioTexto":"2019 - ongoing","paisDetalle":"Brazil","institucion":"Conselho Nacional de Justiça","comentarios":"The SEEU is considered one of the main digital transformation tools of the Brazilian justice system, contributing directly to overcoming structural problems identified in criminal enforcement, including those highlighted in ADPF 347. The experience has high replicability potential in other countries of the region as a model of digital governance applied to justice."}},{"id":137,"dimensionId":"digital","pais":"CR","nivel":"Nacional","anio":2026,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"delfino.cr","en":"delfino.cr"},"url":"https://delfino.cr/2025/12/defensoria-impulsa-el-desarrollo-del-observatorio-nacional-de-ddhh-y-presenta-sus-primeros-logros"}],"es":{"titulo":"Observatorio de Derechos Humanos","resumen":"Plataforma digital para monitoreo, visualización y análisis de información sobre derechos humanos y grupos en situación de vulnerabilidad.","buenaPractica":"Uso de datos abiertos y analítica para fortalecer rendición de cuentas y políticas públicas.","actores":"PNUD, Defensoría de los Habitantes, observatorio Nacional de Derechos Humanos (ONADH)","nivelDetalle":"Nacional","anioTexto":"2023-2026","paisDetalle":"Costa Rica","institucion":"Defensoría de los Habitantes","comentarios":"Referente regional para instituciones nacionales de derechos humanos."},"en":{"titulo":"Human Rights Observatory","resumen":"Digital platform for monitoring, visualizing, and analyzing information on human rights and groups in situations of vulnerability.","buenaPractica":"Use of open data and analytics to strengthen accountability and public policies.","actores":"UNDP, Ombudsperson's Office (Defensoría de los Habitantes), National Human Rights Observatory (ONADH)","nivelDetalle":"National","anioTexto":"2023-2026","paisDetalle":"Costa Rica","institucion":"Defensoría de los Habitantes","comentarios":"Regional benchmark for national human rights institutions."}},{"id":138,"dimensionId":"digital","pais":"PE","nivel":"Nacional","anio":2021,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/peru/noticias/sisjupaz-una-herramienta-clave-para-fortalecer-la-justicia-de-paz-en-la-atencion-de-casos-de-violencia"},{"label":{"es":"pj.gob.pe","en":"pj.gob.pe"},"url":"https://www.pj.gob.pe/wps/wcm/connect/onajup/s_onajup/as_noticias/cs_n_onajup_lanza_of_sist_just_sisjupaz_21082025"},{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/peru/noticias/elvia-barrios-sobre-sisjupaz-la-trazabilidad-hara-que-la-coordinacion-entre-autoridades-sea-mas-agil-y-dinamica"}],"es":{"titulo":"SISJUPAZ - Sistema Único de Justicia de Paz","resumen":"Sistema digital para fortalecer la gestión y articulación de la justicia de paz en el Perú.","buenaPractica":"Primer sistema digital exclusivo para jueces y juezas de paz en el país, diseñado mediante un proceso de co-diagnóstico y adaptación a necesidades territoriales, que facilita el registro y seguimiento de casos, la articulación con la justicia ordinaria y la generación de evidencia para la toma de decisiones. Piloto en 4 distritos judiciales del país, con equipamiento tecnológico y capacitacion para su uso.","actores":"PNUD, Poder Judicial, KOICA","nivelDetalle":"Nacional y local","anioTexto":"Desde 2021","paisDetalle":"Perú","institucion":"Poder Judicial"},"en":{"titulo":"SISJUPAZ - Single Justice of the Peace System","resumen":"Digital system to strengthen the management and coordination of justice of the peace in Peru.","buenaPractica":"First digital system exclusively for justices of the peace in the country, designed through a co-diagnostic process and adaptation to territorial needs, which facilitates case registration and follow-up, coordination with the ordinary justice system, and the generation of evidence for decision-making. Piloted in 4 judicial districts of the country, with technological equipment and training for its use.","actores":"UNDP, Judiciary, KOICA","nivelDetalle":"National and local","anioTexto":"Since 2021","paisDetalle":"Peru","institucion":"Poder Judicial"}},{"id":139,"dimensionId":"digital","pais":"PE","nivel":"Nacional","anio":2026,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"youtube.com","en":"youtube.com"},"url":"https://www.youtube.com/watch?v=G1yUwhhOgRo"},{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/peru/noticias/rimanakuy-nos-estamos-escuchando"}],"es":{"titulo":"Plataforma Digital Única de Prevención y Gestión de Conflictos Sociales del Estado Peruano","resumen":"Fortalecimiento de una plataforma digital única e interoperable para la gestión de conflictos sociales.","buenaPractica":"Articula información entre el Poder Ejecutivo y gobiernos subnacionales, fortalece los sistemas de alerta temprana y mejora el seguimiento de compromisos para una toma de decisiones más oportuna y basada en evidencia.","actores":"PNUD, PCM","nivelDetalle":"Nacional","anioTexto":"2024 - 2026","paisDetalle":"Perú","institucion":"Presidencia del Consejo de Ministros (PCM)"},"en":{"titulo":"Single Digital Platform for the Prevention and Management of Social Conflicts of the Peruvian State","resumen":"Strengthening of a single, interoperable digital platform for the management of social conflicts.","buenaPractica":"Coordinates information between the Executive Branch and subnational governments, strengthens early warning systems, and improves the follow-up of commitments for more timely, evidence-based decision-making.","actores":"UNDP, PCM","nivelDetalle":"National","anioTexto":"2024 - 2026","paisDetalle":"Peru","institucion":"Presidency of the Council of Ministers (PCM)"}},{"id":140,"dimensionId":"digital","pais":"PE","nivel":"Nacional","anio":2026,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/peru/noticias/la-pregunta-no-es-si-el-peru-puede-avanzar-en-ia-sino-como-hacerlo-estrategicamente"}],"es":{"titulo":"AILA: Evaluación del Panorama de Inteligencia Artificial – Perú","resumen":"Evaluación de preparación para la adopción responsable de IA (ecosistema, IA para el gobierno y regulación/ética), con recomendaciones y hoja de ruta.","buenaPractica":"Elaboración colaborativa de un diagnóstico integral nacional sobre el uso responsable de la IA, mediante consultas a expertos y actores multisectoriales, para fortalecer capacidades institucionales y apoyar el desarrollo de la Estrategia Nacional de IA.","actores":"PNUD, PCM","nivelDetalle":"Nacional","anioTexto":"2025/2026","paisDetalle":"Perú","institucion":"Presidencia del Consejo de Ministros (PCM)"},"en":{"titulo":"AILA: Artificial Intelligence Landscape Assessment – Peru","resumen":"Readiness assessment for the responsible adoption of AI (ecosystem, AI for government, and regulation/ethics), with recommendations and a roadmap.","buenaPractica":"Collaborative development of a comprehensive national diagnostic on the responsible use of AI, through consultations with experts and multisectoral actors, to strengthen institutional capacities and support the development of the National AI Strategy.","actores":"UNDP, PCM","nivelDetalle":"National","anioTexto":"2025/2026","paisDetalle":"Peru","institucion":"Presidency of the Council of Ministers (PCM)"}},{"id":141,"dimensionId":"digital","pais":"PE","nivel":"Nacional","anio":2023,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"visor.geoperu.gob.pe","en":"visor.geoperu.gob.pe"},"url":"https://visor.geoperu.gob.pe/?layers=1"}],"es":{"titulo":"GeoPerú (ex Sayhuite)","resumen":"Acompañamiento técnico a la evolución de la herramienta Sayhuite hacia GeoPerú, apoyando a la PCM en el proceso de migración tecnológica, la articulación entre secretarías y el fortalecimiento de capacidades de gobiernos regionales y locales para el uso de información geoespacial.","buenaPractica":"Fortalece la gobernanza de datos mediante la integración e interoperabilidad de información territorial proveniente de distintas entidades públicas.Promueve una gestión basada en evidencia para la planificación territorial y la toma de decisiones públicas.","actores":"PNUD, PCM (Secretarías de Descentralización, y Gobierno y Transformación Digital)","nivelDetalle":"Nacional","anioTexto":"2020-2023","paisDetalle":"Perú","institucion":"Presidencia del Consejo de Ministros (PCM)"},"en":{"titulo":"GeoPerú (formerly Sayhuite)","resumen":"Technical support for the evolution of the Sayhuite tool into GeoPerú, assisting the PCM in the technological migration process, coordination between secretariats, and the strengthening of regional and local government capacities for the use of geospatial information.","buenaPractica":"Strengthens data governance through the integration and interoperability of territorial information from different public entities. Promotes evidence-based management for territorial planning and public decision-making.","actores":"UNDP, PCM (Secretariats of Decentralization, and of Government and Digital Transformation)","nivelDetalle":"National","anioTexto":"2020-2023","paisDetalle":"Peru","institucion":"Presidency of the Council of Ministers (PCM)"}},{"id":142,"dimensionId":"digital","pais":"PE","nivel":"Nacional","anio":2023,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/peru/noticias/un-sistema-de-alerta-es-fundamental-para-prevenir-conflictos-electorales"},{"label":{"es":"facebook.com","en":"facebook.com"},"url":"https://www.facebook.com/ONPEoficial/videos/conoces-el-mapa-de-alertas-de-conflictos-electorales-mace/968610848498100/"},{"label":{"es":"mace.onpe.gob.pe","en":"mace.onpe.gob.pe"},"url":"https://mace.onpe.gob.pe/dashboard/map/mace"}],"es":{"titulo":"MACE - Mapa de Alerta de Conflictos Electorales","resumen":"Sistema de alerta temprana que permite identificar, monitorear y reportar incidentes y potenciales conflictos electorales, facilitando respuestas oportunas por parte de los organismos electorales.","buenaPractica":"Su implementación se basó en un enfoque participativo y de apropiación institucional desde las etapas iniciales de diseño. La experiencia involucró consultas amplias con actores estatales y de la sociedad civil, fortalecimiento de capacidades, desarrollo de protocolos y adaptación tecnológica a las necesidades nacionales. Promoción de sostenibilidad institucional, coordinación interinstitucional y capacidades preventivas para la gestión temprana de riesgos electorales.","actores":"PNUD, organismos electorales","nivelDetalle":"Nacional","anioTexto":"Desde 2023","paisDetalle":"Perú","institucion":"Oficina Nacional de Procesos Electorales (ONPE)"},"en":{"titulo":"MACE - Electoral Conflict Alert Map","resumen":"Early warning system that enables the identification, monitoring, and reporting of incidents and potential electoral conflicts, facilitating timely responses by electoral bodies.","buenaPractica":"Its implementation was based on a participatory approach and institutional ownership from the initial design stages. The experience involved broad consultations with state and civil society actors, capacity building, protocol development, and technological adaptation to national needs. Promotion of institutional sustainability, inter-institutional coordination, and preventive capacities for the early management of electoral risks.","actores":"UNDP, electoral bodies","nivelDetalle":"National","anioTexto":"Since 2023","paisDetalle":"Peru","institucion":"Oficina Nacional de Procesos Electorales (ONPE)"}},{"id":143,"dimensionId":"digital","pais":"PE","nivel":"Nacional","anio":2025,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"defensoria.gob.pe","en":"defensoria.gob.pe"},"url":"https://www.defensoria.gob.pe/defensoria-del-pueblo-anuncia-creacion-de-observatorio-de-la-conflictividad-social/"}],"es":{"titulo":"Observatorio de Conflictividad Social","resumen":"Asistencia técnica para el diseño y desarrollo de primeras fases del observatorio destinado a integrar, sistematizar y analizar información sobre conflictividad social mediante herramientas digitales y mecanismos de alerta temprana.","buenaPractica":"Incorpora herramientas de análisis de información de diversas fuentes en tiempo real, visualización de datos y monitoreo georreferenciado, facilitando la toma de decisiones informadas y la identificación oportuna de tendencias y riesgos emergentes. Busca promover una gestión más estratégica y preventiva de la conflictividad social.","actores":"PNUD, Defensoría del Pueblo","nivelDetalle":"Nacional","anioTexto":"2025","paisDetalle":"Perú","institucion":"Defensoría del Pueblo"},"en":{"titulo":"Social Conflict Observatory","resumen":"Technical assistance for the design and development of the first phases of the observatory, intended to integrate, systematize, and analyze information on social conflict through digital tools and early warning mechanisms.","buenaPractica":"Incorporates tools for real-time analysis of information from diverse sources, data visualization, and georeferenced monitoring, facilitating informed decision-making and the timely identification of emerging trends and risks. Seeks to promote a more strategic and preventive management of social conflict.","actores":"UNDP, Ombudsperson's Office (Defensoría del Pueblo)","nivelDetalle":"National","anioTexto":"2025","paisDetalle":"Peru","institucion":"Defensoría del Pueblo"}},{"id":144,"dimensionId":"digital","pais":"UN","nivel":"Subnacional","anio":2026,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"Sitio del PNUD","en":"UNDP website"},"url":"https://www.undp.org/es/latin-america/noticias/radar-de-soluciones"}],"es":{"titulo":"JUSTINA – Asistente Inteligente para Justicia y Seguridad","resumen":"Herramienta de inteligencia artificial integrada al Radar de Soluciones del PNUD para apoyar diseño de políticas, análisis comparado, identificación de buenas prácticas y formulación programática.","buenaPractica":"Aplicación de IA como bien público digital para fortalecer capacidades institucionales y acelerar transferencia de conocimiento.","actores":"","nivelDetalle":"Regional","anioTexto":"2026","paisDetalle":"Regional","institucion":"PNUD LAC"},"en":{"titulo":"JUSTINA – Intelligent Assistant for Justice and Security","resumen":"Artificial intelligence tool integrated into the UNDP Solutions Radar to support policy design, comparative analysis, identification of good practices, and programmatic formulation.","buenaPractica":"Application of AI as a digital public good to strengthen institutional capacities and accelerate knowledge transfer.","actores":"","nivelDetalle":"Regional","anioTexto":"2026","paisDetalle":"Regional","institucion":"UNDP LAC"}},{"id":145,"dimensionId":"intergeneracional","pais":"BR","nivel":"Nacional","anio":2023,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"gov.br","en":"gov.br"},"url":"https://www.gov.br/mj/pt-br/assuntos/noticias/mjsp-anuncia-novos-investimentos-em-pesquisa-e-lanca-analise-da-politica-publica-201cto-de-boa201d-sobre-prevencao-ampliada"}],"es":{"titulo":"PRONASCI Juventud – Tô de Boa: caminos hacia una política de drogas con justicia racial para las juventudes","resumen":"Estrategia integral de prevención dirigida a adolescentes y jóvenes de territorios en situación de vulnerabilidad, desarrollada por la Secretaría Nacional de Políticas sobre Drogas y Gestión de Activos (SENAD) en alianza con el PNUD. La iniciativa combina inclusión productiva, generación de ingresos, fortalecimiento comunitario, desarrollo biopsicosocial y promoción de proyectos de vida, articulando políticas de seguridad ciudadana, asistencia social, educación y participación comunitaria. Posteriormente, la experiencia fue incorporada como referencia para la implementación del programa PRONASCI Juventud.","buenaPractica":"La experiencia adopta un enfoque territorial e intergeneracional para la prevención de la violencia asociada a los mercados ilícitos de drogas, situando a las y los jóvenes como protagonistas de la transformación social y promoviendo la articulación entre familias, escuelas, servicios públicos y liderazgos comunitarios. El modelo integra principios de justicia racial, desarrollo humano y uso de evidencia para el perfeccionamiento continuo de las políticas públicas.","actores":"SENAD/MJSP, PNUD, Fiocruz, governos locais, organizações da sociedade civil, lideranças comunitárias, famílias e juventudes participantes","nivelDetalle":"Nacional","anioTexto":"2023 - atual","paisDetalle":"Brasil","institucion":"Ministério da Justiça e da Segurança Pública","comentarios":"La evaluación de la experiencia contribuyó al perfeccionamiento de las políticas públicas sobre drogas y prevención de la violencia dirigidas a las juventudes. El lanzamiento de la publicación “Tô de Boa – Caminos hacia una política de drogas con justicia racial para las juventudes” se realizó conjuntamente con la instalación del Comité Gestor del PRONASCI Juventud – Río de Janeiro, evidenciando la incorporación de los aprendizajes y resultados del proyecto en la expansión y fortalecimiento de esta política pública."},"en":{"titulo":"PRONASCI Youth – Tô de Boa: pathways toward a drug policy with racial justice for youth","resumen":"Comprehensive prevention strategy aimed at adolescents and young people from territories in situations of vulnerability, developed by the National Secretariat for Drug Policies and Asset Management (SENAD) in partnership with UNDP. The initiative combines productive inclusion, income generation, community strengthening, biopsychosocial development, and the promotion of life projects, linking citizen security, social assistance, education, and community participation policies. The experience was subsequently incorporated as a reference for the implementation of the PRONASCI Youth program.","buenaPractica":"The experience adopts a territorial and intergenerational approach to preventing violence associated with illicit drug markets, placing young people as protagonists of social transformation and promoting coordination among families, schools, public services, and community leaders. The model integrates principles of racial justice, human development, and the use of evidence for the continuous improvement of public policies.","actores":"SENAD/MJSP, UNDP, Fiocruz, local governments, civil society organizations, community leaders, families, and participating youth","nivelDetalle":"National","anioTexto":"2023 - ongoing","paisDetalle":"Brazil","institucion":"Ministério da Justiça e da Segurança Pública","comentarios":"The evaluation of the experience contributed to improving public policies on drugs and violence prevention aimed at youth. The launch of the publication \"Tô de Boa – Pathways toward a drug policy with racial justice for youth\" took place jointly with the installation of the PRONASCI Youth Management Committee – Rio de Janeiro, demonstrating the incorporation of the project's lessons and results into the expansion and strengthening of this public policy."}},{"id":146,"dimensionId":"intergeneracional","pais":"BR","nivel":"Nacional","anio":2026,"vinculadaPNUD":true,"destacada":false,"fuentes":[],"es":{"titulo":"Justiça Plural - Diálogos con las Juventudes","resumen":"El proyecto Diálogos con las Juventudes forma parte del Programa Justicia Plural, una iniciativa del Consejo Nacional de Justicia (CNJ) en cooperación con el Programa de las Naciones Unidas para el Desarrollo (PNUD). Su objetivo es promover el acercamiento y el diálogo entre actores del Poder Judicial y las juventudes en torno a debates sobre derechos humanos y acceso a la justicia. La principal actividad prevista es la realización de talleres en escuelas públicas de educación secundaria, facilitados por magistradas y magistrados. Durante estas actividades se abordarán temas como la equidad étnico-racial, la ciudadanía digital y la justicia climática, siempre vinculados a la garantía del acceso a la justicia.","buenaPractica":"Una de las principales buenas prácticas del proyecto Diálogos con las Juventudes es su capacidad para acercar el Poder Judicial a las y los jóvenes mediante espacios de diálogo directo en escuelas públicas, promoviendo una relación más cercana, accesible y basada en la confianza. A través de una metodología participativa y adaptada al lenguaje juvenil, el proyecto fomenta la reflexión sobre derechos humanos, ciudadanía digital, equidad étnico-racial y justicia climática, conectando estos temas con el acceso a la justicia. Asimismo, destaca la articulación entre instituciones públicas, organismos internacionales y sociedad civil, combinando experiencia técnica, pedagógica e institucional para fortalecer la educación cívica y la participación juvenil.","actores":"PNUD Brasil; Conselho Nacional de Justiça - CNJ;","nivelDetalle":"Nacional","anioTexto":"2024–2026","paisDetalle":"Brasil","institucion":"Conselho Nacional de Justiça (CNJ)","comentarios":"La sistematización de la experiencia piloto también constituye una buena práctica, ya que permite generar evidencia y aprendizajes para replicar y ampliar la iniciativa en otros territorios del país."},"en":{"titulo":"Justiça Plural - Dialogues with Youth","resumen":"The Dialogues with Youth project is part of the Justiça Plural Program, an initiative of the National Council of Justice (CNJ) in cooperation with the United Nations Development Programme (UNDP). Its objective is to promote engagement and dialogue between actors of the Judiciary and young people around debates on human rights and access to justice. The main planned activity is the holding of workshops in public secondary schools, facilitated by judges. These activities will address topics such as ethnic-racial equity, digital citizenship, and climate justice, always linked to guaranteeing access to justice.","buenaPractica":"One of the main good practices of the Dialogues with Youth project is its ability to bring the Judiciary closer to young people through spaces for direct dialogue in public schools, promoting a closer, more accessible, and trust-based relationship. Through a participatory methodology adapted to youth language, the project encourages reflection on human rights, digital citizenship, ethnic-racial equity, and climate justice, connecting these topics with access to justice. It also highlights the coordination among public institutions, international organizations, and civil society, combining technical, pedagogical, and institutional expertise to strengthen civic education and youth participation.","actores":"UNDP Brazil; Conselho Nacional de Justiça - CNJ;","nivelDetalle":"National","anioTexto":"2024–2026","paisDetalle":"Brazil","institucion":"Conselho Nacional de Justiça (CNJ)","comentarios":"The systematization of the pilot experience is also a good practice, as it generates evidence and lessons learned to replicate and scale up the initiative in other territories of the country."}},{"id":147,"dimensionId":"intergeneracional","pais":"BR","nivel":"Nacional","anio":2026,"vinculadaPNUD":true,"destacada":false,"fuentes":[],"es":{"titulo":"Pontes para Convergências","resumen":"La iniciativa implementó diversas acciones orientadas a fortalecer el espacio cívico, la participación juvenil y la gobernanza intergeneracional. Entre ellas destacan: (i) el lanzamiento de la encuesta regional “Puentes para la Convergencia – Voces de las Juventudes”, dirigida a jóvenes de entre 18 y 29 años de América Latina y el Caribe; (ii) la organización del encuentro multiactor “Gobiernos del Futuro: Expectativas de las Juventudes para la Democracia”; y (iii) la articulación regional con la Oficina Regional para América Latina y el Caribe (RBLAC) para la implementación de los Policy Labs sobre Juventud y Democracia. Estas acciones promovieron la participación inclusiva, el diálogo democrático y la incorporación de evidencia y perspectivas juveniles en los debates sobre políticas públicas y gobernanza democrática.","buenaPractica":"El proyecto Puentes para la Convergencia promovió la participación efectiva de las juventudes en espacios de diálogo y construcción de políticas públicas, pasando de un enfoque de consulta a un modelo de cocreación e incidencia. La combinación de metodologías participativas, diálogo intergeneracional y mecanismos de incidencia permitió fortalecer la confianza entre generaciones, ampliar la representación de voces diversas y generar insumos estratégicos para una gobernanza más inclusiva, colaborativa y orientada al futuro.","actores":"PNUD Brasil;RBLAC; Funding Windows","nivelDetalle":"Nacional","anioTexto":"2025–2026","paisDetalle":"Brasil","institucion":"PNUD Brasil","comentarios":"A través de mecanismos innovadores como la encuesta regional Voces de las Juventudes, los Policy Labs, la metodología Fishbowl y herramientas digitales, las y los jóvenes pudieron interactuar directamente con autoridades, especialistas y tomadores de decisión, contribuyendo con propuestas concretas sobre los desafíos democráticos de la región. Este proceso culminó en la elaboración de la Carta de las Juventudes para el Futuro de la Democracia – Declaración de Brasilia, un documento construido colectivamente que recoge prioridades y recomendaciones para fortalecer la democracia, la inclusión y la participación ciudadana."},"en":{"titulo":"Pontes para Convergências","resumen":"The initiative implemented various actions aimed at strengthening civic space, youth participation, and intergenerational governance. These include: (i) the launch of the regional survey \"Bridges for Convergence – Voices of Youth,\" aimed at young people aged 18 to 29 in Latin America and the Caribbean; (ii) the organization of the multi-stakeholder gathering \"Governments of the Future: Youth Expectations for Democracy\"; and (iii) regional coordination with the Regional Bureau for Latin America and the Caribbean (RBLAC) for the implementation of the Policy Labs on Youth and Democracy. These actions promoted inclusive participation, democratic dialogue, and the incorporation of evidence and youth perspectives into debates on public policies and democratic governance.","buenaPractica":"The Bridges for Convergence project promoted the effective participation of youth in spaces for dialogue and public policy-making, moving from a consultation approach to a model of co-creation and advocacy. The combination of participatory methodologies, intergenerational dialogue, and advocacy mechanisms strengthened trust between generations, broadened the representation of diverse voices, and generated strategic inputs for more inclusive, collaborative, and future-oriented governance.","actores":"UNDP Brazil; RBLAC; Funding Windows","nivelDetalle":"National","anioTexto":"2025–2026","paisDetalle":"Brazil","institucion":"UNDP Brazil","comentarios":"Through innovative mechanisms such as the regional survey Voices of Youth, the Policy Labs, the Fishbowl methodology, and digital tools, young people were able to interact directly with authorities, specialists, and decision-makers, contributing concrete proposals on the region's democratic challenges. This process culminated in the drafting of the Youth Charter for the Future of Democracy – Brasilia Declaration, a collectively built document that gathers priorities and recommendations to strengthen democracy, inclusion, and citizen participation."}},{"id":148,"dimensionId":"intergeneracional","pais":"PE","nivel":"Nacional","anio":2021,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"drive.google.com","en":"drive.google.com"},"url":"https://drive.google.com/file/d/18LRQSeD0CSKDtMYXsAdB18XRFrosbDOx/view"},{"label":{"es":"redpublica.com.pe","en":"redpublica.com.pe"},"url":"https://redpublica.com.pe/?locale=es"}],"es":{"titulo":"Redpública","resumen":"Red y plataforma digital para potenciar la participación ciudadana y la incidencia pública de juventudes.","buenaPractica":"Co-creación de propuestas de solución a retos del país por parte de juventudes, recopiladas en la agenda pública digital \"Portafolio Redpública\", mediante herramientas digitales y espacios participativos como consultas ciudadanas, festivales, hackatones, voluntariado juvenil, chatbots y módulos descentralizados de información en el contexto de la pandemia COVID-19. Canalización de consultas digitales en temas de interés juvenil en apoyo a procesos impulsados por la Secretaría Nacional de la Juventud.","actores":"PNUD, organizaciones de juventudes, liderazgos jóvenes","nivelDetalle":"Nacional","anioTexto":"Desde 2021","paisDetalle":"Perú","institucion":"PNUD Perú"},"en":{"titulo":"Redpública","resumen":"Network and digital platform to enhance citizen participation and public advocacy by youth.","buenaPractica":"Co-creation of proposed solutions to the country's challenges by youth, compiled in the digital public agenda \"Portafolio Redpública,\" through digital tools and participatory spaces such as citizen consultations, festivals, hackathons, youth volunteering, chatbots, and decentralized information modules in the context of the COVID-19 pandemic. Channeling of digital consultations on topics of youth interest in support of processes led by the National Youth Secretariat.","actores":"UNDP, youth organizations, young leaders","nivelDetalle":"National","anioTexto":"Since 2021","paisDetalle":"Peru","institucion":"UNDP Peru"}},{"id":149,"dimensionId":"intergeneracional","pais":"PE","nivel":"Nacional","anio":2025,"vinculadaPNUD":true,"destacada":false,"fuentes":[{"label":{"es":"redpublica.com.pe","en":"redpublica.com.pe"},"url":"https://redpublica.com.pe/processes/jovenes-tejiendo-ciudadania"},{"label":{"es":"facebook.com","en":"facebook.com"},"url":"https://www.facebook.com/senajuperu/posts/%EF%B8%8F%EF%B8%8F-j%C3%B3venes-participaron-en-el-encuentro-centro-denominado-j%C3%B3venes-tejiendo-ciuda/1111162364384036/"}],"es":{"titulo":"Jóvenes Tejiendo Ciudadanía","resumen":"Proceso participativo desarrollado en 12 regiones del país para canalizar la incidencia juvenil a través de la identificación de problemáticas territoriales y la formulación de propuestas de solución por parte de jóvenes, en el marco de \"Tejiendo Ciudadanía: Encuentros por el Perú\".","buenaPractica":"Participación significativa descentralizada de juventudes mediante una metodología que aseguró la representación territorial y construcción colectiva de propuestas. La experiencia fortaleció liderazgos juveniles y la incorporación de sus perspectivas en un proceso de diálogos macrorregionales resultante en una agenda ciudadana. Alianzas con universidades para ampliar el alcance.","actores":"PNUD, juventudes, universidades, Secretaría Nacional de la Juventud (SENAJU)","nivelDetalle":"Nacional y regiones","anioTexto":"2024-2025","paisDetalle":"Perú","institucion":"PNUD Perú"},"en":{"titulo":"Jóvenes Tejiendo Ciudadanía (Youth Weaving Citizenship)","resumen":"Participatory process carried out in 12 regions of the country to channel youth advocacy through the identification of territorial problems and the formulation of proposed solutions by young people, within the framework of \"Tejiendo Ciudadanía: Encuentros por el Perú.\"","buenaPractica":"Meaningful decentralized youth participation through a methodology that ensured territorial representation and the collective construction of proposals. The experience strengthened youth leadership and the incorporation of their perspectives into a process of macro-regional dialogues resulting in a citizen agenda. Partnerships with universities to expand reach.","actores":"UNDP, youth, universities, National Youth Secretariat (SENAJU)","nivelDetalle":"National and regions","anioTexto":"2024-2025","paisDetalle":"Peru","institucion":"UNDP Peru"}}];

</script>
  <script>
/* Banco de Experiencias de Gobernanza Pública — capa de datos (bilingüe ES/EN).
   Construye window.BANCO a partir de los 104 casos REALES cargados en
   assets/experiences.js (generado desde el Excel ES + en-US de la guía estratégica).
   Los agregados (KPIs, mapa, barras) se calculan dinámicamente y son
   independientes del idioma; los textos se resuelven por locale en la UI. */
(function () {
  // ---- 6 aceleradores de gobernanza (orden oficial de la guía) ----
  const dimensions = [
    { id: 'anticipatoria', n: 1, nombre: { es: 'Gobernanza anticipatoria', en: 'Anticipatory governance' }, icon: 'anticipatoria', tint: '#3091A6', soft: '#E4F2F5' },
    { id: 'colaborativa', n: 2, nombre: { es: 'Gobernanza colaborativa', en: 'Collaborative governance' }, icon: 'colaborativa', tint: '#1E8FB0', soft: '#E3F2F6' },
    { id: 'comunicacional', n: 3, nombre: { es: 'Gobernanza comunicacional', en: 'Communicational governance' }, icon: 'comunicacional', tint: '#2C7BD0', soft: '#E8F0FB' },
    { id: 'integra', n: 4, nombre: { es: 'Gobernanza íntegra', en: 'Governance with integrity' }, icon: 'integra', tint: '#1F9C8F', soft: '#E2F4F1' },
    { id: 'digital', n: 5, nombre: { es: 'Gobernanza digital', en: 'Digital governance' }, icon: 'digital', tint: '#1F6FC2', soft: '#E7EFFA' },
    { id: 'intergeneracional', n: 6, nombre: { es: 'Gobernanza intergeneracional', en: 'Intergenerational governance' }, icon: 'intergeneracional', tint: '#3E73C9', soft: '#E9EFFB' },
  ];

  // niveles: claves canónicas (idioma-neutras); las etiquetas se traducen en nivelLabels
  const niveles = ['Nacional', 'Subnacional', 'Local'];
  const nivelLabels = {
    es: { Nacional: 'Nacional', Subnacional: 'Subnacional', Local: 'Local' },
    en: { Nacional: 'National', Subnacional: 'Subnational', Local: 'Local' },
  };

  // ---- catálogo de países LAC (nombre bilingüe, bandera) ----
  const C = (code, es, en, flag) => ({ code, nombre: { es, en }, flag });
  const countries = [
    C('MX', 'México', 'Mexico', '🇲🇽'), C('GT', 'Guatemala', 'Guatemala', '🇬🇹'),
    C('BZ', 'Belice', 'Belize', '🇧🇿'), C('SV', 'El Salvador', 'El Salvador', '🇸🇻'),
    C('HN', 'Honduras', 'Honduras', '🇭🇳'), C('NI', 'Nicaragua', 'Nicaragua', '🇳🇮'),
    C('CR', 'Costa Rica', 'Costa Rica', '🇨🇷'), C('PA', 'Panamá', 'Panama', '🇵🇦'),
    C('CU', 'Cuba', 'Cuba', '🇨🇺'), C('DO', 'R. Dominicana', 'Dominican Rep.', '🇩🇴'),
    C('HT', 'Haití', 'Haiti', '🇭🇹'), C('JM', 'Jamaica', 'Jamaica', '🇯🇲'),
    C('TT', 'Trinidad y Tobago', 'Trinidad and Tobago', '🇹🇹'), C('CO', 'Colombia', 'Colombia', '🇨🇴'),
    C('VE', 'Venezuela', 'Venezuela', '🇻🇪'), C('GY', 'Guyana', 'Guyana', '🇬🇾'),
    C('EC', 'Ecuador', 'Ecuador', '🇪🇨'), C('PE', 'Perú', 'Peru', '🇵🇪'),
    C('BO', 'Bolivia', 'Bolivia', '🇧🇴'), C('BR', 'Brasil', 'Brazil', '🇧🇷'),
    C('PY', 'Paraguay', 'Paraguay', '🇵🇾'), C('CL', 'Chile', 'Chile', '🇨🇱'),
    C('AR', 'Argentina', 'Argentina', '🇦🇷'), C('UY', 'Uruguay', 'Uruguay', '🇺🇾'),
    // pseudo-país para experiencias regionales ALC (sin geografía en el mapa)
    C('UN', 'Regional (ALC)', 'Regional (LAC)', '🇺🇳'),
  ];
  const cName = {}; countries.forEach((c) => (cName[c.code] = c));

  // ---- experiencias REALES (cada una con sub-objetos .es y .en) ----
  const experiences = (window.EXPERIENCES_RAW || []).map((e) => ({
    ...e,
    flag: (cName[e.pais] || {}).flag || '',
  }));

  // marcar como destacada la experiencia PNUD más reciente de cada dimensión
  dimensions.forEach((d) => {
    const inDim = experiences.filter((e) => e.dimensionId === d.id && e.vinculadaPNUD);
    if (inDim.length) inDim.sort((a, b) => b.anio - a.anio || a.id - b.id)[0].destacada = true;
  });

  // ---- agregados (idioma-neutros) ----
  const byDimension = dimensions.map((d) => ({
    ...d, count: experiences.filter((e) => e.dimensionId === d.id).length,
  }));
  const total = experiences.length;
  byDimension.forEach((d) => (d.pct = total ? Math.round((d.count / total) * 100) : 0));

  const byCountry = {};
  countries.forEach((c) => (byCountry[c.code] = 0));
  experiences.forEach((e) => { if (byCountry[e.pais] != null) byCountry[e.pais]++; });
  const maxCountry = Math.max(1, ...Object.values(byCountry));

  function intensity(code) {
    const v = byCountry[code] || 0;
    if (v === 0) return 'none';
    if (v >= maxCountry * 0.62) return 'alta';
    if (v >= maxCountry * 0.3) return 'media';
    return 'baja';
  }

  const stats = {
    total,
    vinculadas: experiences.filter((e) => e.vinculadaPNUD).length,
    adicionales: experiences.filter((e) => !e.vinculadaPNUD).length,
    dimensiones: dimensions.length,
    paises: countries.filter((c) => c.code !== 'UN' && byCountry[c.code] > 0).length,
  };

  // ---- diccionario de cadenas de interfaz ----
  const strings = {
    es: {
      title: 'Repositorio interactivo',
      subtitle: 'Banco de experiencias de gobernanza pública · América Latina y el Caribe',
      topbarNote: (s) => `${s.total} experiencias · ${s.vinculadas} vinculadas al PNUD · ${s.paises} países · enlaces oficiales en cada ficha`,
      searchPlaceholder: 'Buscar por palabra clave, tema, institución…',
      fPais: 'País', fDim: 'Dimensión', fNivel: 'Nivel de gobierno', fInst: 'Institución',
      clear: 'Limpiar filtros',
      mapTitle: 'Mapa de América Latina y el Caribe',
      mapCaption: (s) => `${s.paises} países · ${s.total} experiencias · clic en un país para filtrar`,
      sortBy: 'Ordenar por:', sortRecent: 'Más recientes', sortAlpha: 'Alfabético', sortCountry: 'País',
      expS: 'experiencia', expP: 'experiencias',
      noResultsT: 'Sin resultados', noResultsB: 'Ajusta los filtros o el término de búsqueda para encontrar experiencias.',
      download: 'Descargar base', viewFichas: 'Ver fichas',
      legAlta: 'Alta', legMedia: 'Media', legBaja: 'Baja',
      pnudTag: 'PNUD',
      fhPais: 'País', fhNivel: 'Nivel de gobierno', fhInst: 'Institución', fhAnio: 'Año o período',
      fhDesc: 'Descripción', fhBP: 'Buena práctica', fhActores: 'Actores principales', fhLinks: 'Enlaces de consulta',
      fhComentarios: 'Comentarios adicionales',
      remove: 'Quitar', close: 'Cerrar', zoomIn: 'Acercar', zoomOut: 'Alejar',
      csvHead: ['Título', 'Dimensión', 'País', 'Institución', 'Nivel', 'Año', 'Vinculada PNUD'], csvYes: 'Sí', csvNo: 'No',
    },
    en: {
      title: 'Interactive repository',
      subtitle: 'Public governance experience bank · Latin America and the Caribbean',
      topbarNote: (s) => `${s.total} experiences · ${s.vinculadas} linked to UNDP · ${s.paises} countries · official links in every record`,
      searchPlaceholder: 'Search by keyword, topic, institution…',
      fPais: 'Country', fDim: 'Dimension', fNivel: 'Level of government', fInst: 'Institution',
      clear: 'Clear filters',
      mapTitle: 'Map of Latin America and the Caribbean',
      mapCaption: (s) => `${s.paises} countries · ${s.total} experiences · click a country to filter`,
      sortBy: 'Sort by:', sortRecent: 'Most recent', sortAlpha: 'Alphabetical', sortCountry: 'Country',
      expS: 'experience', expP: 'experiences',
      noResultsT: 'No results', noResultsB: 'Adjust the filters or search term to find experiences.',
      download: 'Download dataset', viewFichas: 'View records',
      legAlta: 'High', legMedia: 'Medium', legBaja: 'Low',
      pnudTag: 'UNDP',
      fhPais: 'Country', fhNivel: 'Level of government', fhInst: 'Institution', fhAnio: 'Year or period',
      fhDesc: 'Description', fhBP: 'Best practice', fhActores: 'Key actors', fhLinks: 'Reference links',
      fhComentarios: 'Additional comments',
      remove: 'Remove', close: 'Close', zoomIn: 'Zoom in', zoomOut: 'Zoom out',
      csvHead: ['Title', 'Dimension', 'Country', 'Institution', 'Level', 'Year', 'UNDP-linked'], csvYes: 'Yes', csvNo: 'No',
    },
  };

  window.BANCO = { dimensions, byDimension, niveles, nivelLabels, countries, cName, experiences, byCountry, maxCountry, intensity, stats, strings };
})();

</script>
